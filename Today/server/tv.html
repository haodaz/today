<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today — the big screen</title>
<!--
  电视端的网页版。

  为什么要有它：评委大概率没有 Fire TV。一个网址就能看见这块屏长什么样，
  比截图有说服力，比装 APK 省事。她自己也用得上——客厅那台不在身边的时候，
  手机、平板、笔记本都能当那块屏。

  和 APK 是同一份数据（/turn），所以不会两边说的不是一回事。
  版式按 16:9 锁死并整体缩放：这样不管窗口多大，看到的都是「一台电视」，
  而不是一个会把内容拉扯变形的网页。
-->
<style>
  :root{
    --accent:#6B5CE7; --warm:#E89B5B;
    --text:#1C1A2A; --soft:#4A4560; --faint:#6E6984;
    --surface:rgba(255,255,255,.84); --surfaceOn:rgba(255,255,255,.97);
    --border:rgba(107,92,231,.13); --shadow:rgba(107,92,231,.14);
    --s1:#EFF3FD; --s2:#F4F2FC; --s3:#F8F8FC;
  }
  /* 一天的光线。和 src/theme.ts 里是同一组值——两块屏不该长得不一样。 */
  body[data-part="dawn"]{--s1:#EAF0FD;--s2:#F0EFFB;--s3:#F7F7FB;--text:#1E1B2E;--soft:#4A4560;--faint:#6E6984;--border:rgba(107,92,231,.14);--shadow:rgba(107,92,231,.16)}
  body[data-part="dusk"]{--s1:#EDE9FA;--s2:#F1ECF8;--s3:#F6F2F6;--text:#231D33;--soft:#4A4560;--faint:#6E6984;--accent:#8C7FF0;--border:rgba(107,92,231,.15);--shadow:rgba(107,92,231,.18)}
  body[data-part="night"]{
    --s1:#14131E;--s2:#171623;--s3:#131220;
    --text:#E9E6F2;--soft:#B9B4CC;--faint:#8F8AA6;--accent:#A094FF;--warm:#E0A472;
    --surface:rgba(26,25,38,.82);--surfaceOn:rgba(40,38,58,.92);
    --border:rgba(160,148,255,.16);--shadow:rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:linear-gradient(150deg,var(--s1) 0%,var(--s2) 52%,var(--s3) 100%);
    font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--text); position:relative;
    transition:background .8s linear, color .4s;
    -webkit-font-smoothing:antialiased;
  }
  /* 固定 960×540（dp），整体缩放。看到的永远是一台电视的比例。
     所有尺寸都是按电视的 dp 写的——Fire TV 渲染 1920×1080、density 320，
     可用正好是 960×540 dp。以前画布写成了 1920×1080 像素，
     于是网页版整个只有真电视的一半大，右下大片空着。
     缩放不改变布局占位，所以不能靠 flex/grid 居中——那是按未缩放的
     尺寸算的，盒子会被推出屏幕。绝对定位 + translate 自己居中。 */
  #tv{
    width:960px;height:540px;position:absolute;
    left:50%;top:50%;transform-origin:center;
  }
  .page{position:absolute;inset:0;display:flex;padding:30px 44px;gap:20px}
  .left{width:38%;padding-right:20px;display:flex;flex-direction:column}
  .right{flex:1;display:flex;flex-direction:column;justify-content:center}

  .clock{font-size:56px;font-weight:300;letter-spacing:-2px;line-height:1.05}
  .date{font-size:13px;color:var(--soft);margin-top:5px;letter-spacing:.5px}
  .wxline{font-size:13px;color:var(--soft);margin-top:5px;letter-spacing:.3px}
  .wxhint{font-size:12px;color:var(--warm);margin-top:1px}
  .rule{height:1px;width:44px;background:var(--border);margin:8px 0}
  .tiger{width:62px;height:86px;object-fit:contain;object-position:left bottom;margin-bottom:5px}
  .say{font-size:26px;font-weight:300;line-height:34px;margin:0}

  .step{margin-top:8px;padding-left:13px;border-left:3px solid var(--accent);border-radius:1px}
  .step.hers{border-left-color:var(--warm)}
  .stepHead{font-size:12px;letter-spacing:1px;color:var(--accent);margin-bottom:1px}
  .step.hers .stepHead{color:var(--warm)}
  .stepText{font-size:20px;line-height:26px}
  .stepNote{font-size:12px;color:var(--faint);margin-top:3px}

  .smallHead{font-size:12px;color:var(--faint);letter-spacing:1px;margin-bottom:5px}
  .laterBlock{margin-top:8px}
  /* 遥控器按下去不用瞄准，鼠标要。网页版把热区垫高一点——
     12px 高的一行，用鼠标点是在考验人的手。 */
  .laterItem{
    font-size:12px;line-height:18px;color:var(--faint);
    cursor:default;border-radius:5px;padding:4px 6px;margin:0 -6px;
  }
  .laterItem.can:hover{background:var(--surface)}
  .laterItem.can{cursor:pointer}
  .laterItem.on{color:var(--accent)}

  .cardHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;padding:0 5px}
  .section{font-size:13px;font-weight:600;letter-spacing:1px;color:var(--soft)}
  .count{font-size:12px;color:var(--faint)}
  .row{
    display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;
    padding:13px 20px;border-radius:18px;margin-bottom:9px;
    background:var(--surface);border:1px solid var(--border);
    box-shadow:0 4px 14px var(--shadow);transition:transform .12s,border-color .12s;
  }
  .row.on{
    background:var(--surfaceOn);border:2px solid var(--accent);
    transform:scale(1.022);box-shadow:0 10px 28px var(--shadow);
  }
  .herEdge{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--warm)}
  .box{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--border);flex:0 0 auto;
    display:grid;place-items:center;font-size:15px;color:#fff}
  .box.done{background:var(--accent);border-color:var(--accent)}
  .label{font-size:20px;font-weight:600}
  .label.done{text-decoration:line-through;color:var(--faint);font-weight:400}
  .note{font-size:12px;color:var(--faint);margin-top:2px}
  .into{margin-left:auto;font-size:30px;font-weight:300;color:var(--accent)}
  .memBlock{margin-top:13px;padding:9px 13px;border-radius:12px;
    background:var(--surface);border:1px solid var(--border)}
  .memItem{font-size:12px;line-height:18px;color:var(--faint)}

  /* 按进去的那一层 */
  #detail{position:absolute;inset:0;background:var(--s2);display:none;padding:30px 44px}
  #detail.on{display:flex;gap:20px}
  #detail .left{width:38%}
  .dTitle{font-size:26px;font-weight:300;line-height:32px;margin-top:8px}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:13px}
  .tag{font-size:12px;border:1px solid var(--border);color:var(--faint);
    border-radius:999px;padding:3px 10px}
  .tag.hers{color:var(--warm);border-color:var(--warm)}
  .close{font-size:12px;color:var(--faint);margin-top:20px}
  .optName{font-size:14px;font-weight:600;margin-top:8px}
  .facts{display:flex;flex-wrap:wrap;gap:4px 13px;margin-top:2px}
  .fact{font-size:13px;line-height:19px;color:var(--soft)}
  .fact b{color:var(--faint);font-weight:400;margin-right:4px}
  /* 唯一关于她自己的那一行，和整个产品用同一个暖色 */
  .fact.hers{color:var(--warm)}
  .fact.hers b{color:var(--warm)}
  .gcard{background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:8px 13px;margin-bottom:8px}
  .optNote{font-size:12px;line-height:17px;color:var(--faint);margin-top:2px}
  .struck{text-decoration:line-through}

  /* 给评委的操作说明。网页版没有遥控器，这一行是唯一告诉人「能按进去」的地方，
     压在窗景上看不见就等于没写——所以垫一块底。 */
  .hint{
    position:fixed;bottom:14px;right:18px;
    font-size:15px;color:var(--soft);letter-spacing:.3px;
    padding:6px 16px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:3
  }

  /* 窗景 + 墙色。和 App.tsx 同一套：画从 /art/ 取，取不到就只剩底下那层渐变。 */
  body{--v0:rgba(246,245,250,.90);--v1:rgba(246,245,250,.80);--v2:rgba(246,245,250,.30);--v3:rgba(246,245,250,.06)}
  body[data-part="dawn"]{--v0:rgba(240,238,250,.90);--v1:rgba(240,238,250,.80);--v2:rgba(240,238,250,.30);--v3:rgba(240,238,250,.06)}
  body[data-part="dusk"]{--v0:rgba(242,235,244,.90);--v1:rgba(242,235,244,.80);--v2:rgba(242,235,244,.32);--v3:rgba(242,235,244,.08)}
  body[data-part="night"]{--v0:rgba(18,17,28,.88);--v1:rgba(18,17,28,.76);--v2:rgba(18,17,28,.34);--v3:rgba(18,17,28,.12)}

  /* 家里人。标题那一行右边一排，卡片上提到谁就挂谁——和 App.tsx 同一套。 */
  .faces{display:flex;align-items:center;gap:10px;margin-left:auto;margin-right:12px;
    padding:4px 12px 4px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--border)}
  .fam{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--soft)}
  .face{width:24px;height:24px;border-radius:50%;border:2px solid;object-fit:cover;background:#fff}
  .who{width:32px;height:32px;border-radius:50%;border:2px solid;object-fit:cover;margin-left:13px;flex:none;background:#fff}
  #detail{z-index:2}
  /* 按进去还是同一扇窗——前后不像两个 app。墙色浓一些，因为这一层全是字。 */
  #tv.art #detail{background:var(--vd)}
  body{--vd:rgba(246,245,250,.90)}
  body[data-part="dawn"]{--vd:rgba(240,238,250,.90)}
  body[data-part="dusk"]{--vd:rgba(242,235,244,.90)}
  body[data-part="night"]{--vd:rgba(18,17,28,.90)}

  /* ── 两区 ─────────────────────────────────────── */
  #scene{position:absolute;left:0;top:0;bottom:0;width:392px;overflow:hidden;background:var(--s2)}
  /* 窗在画的右半边：往右对齐，窄条里露出来的就是窗和窗台 */
  #art{position:absolute;inset:0;background-size:cover;background-position:62% center;
    opacity:0;transition:opacity .9s ease}
  #tv.art #art{opacity:1}
  /* 上面压一点墙色给时钟，下面压一点给气泡；中间整块留给窗 */
  #scrim{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,var(--v0) 0%,var(--v1) 33%,var(--v2) 42%,rgba(0,0,0,0) 52%,rgba(0,0,0,0) 64%,var(--v2) 100%)}
  .sceneTop{position:absolute;left:44px;top:30px;right:24px}
  .sceneBottom{position:absolute;left:28px;right:22px;bottom:14px;display:flex;align-items:flex-end;gap:8px}
  #big{height:178px;flex:none;filter:drop-shadow(0 6px 10px rgba(40,30,60,.22))}
  .bubble{position:relative;flex:1;margin-bottom:96px;padding:9px 13px;border-radius:16px 16px 16px 4px;
    background:var(--surface);border:1px solid var(--border);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 18px var(--shadow)}
  .bubble .say{font-size:16px;line-height:22px;font-weight:400;margin:0}

  #family{position:absolute;left:392px;right:0;top:0;bottom:0;padding:20px 44px 24px 34px;
    display:flex;flex-direction:column;max-width:none}
  #family > *{max-width:520px}
  #faces{display:flex;justify-content:flex-end;max-width:none !important;min-height:30px;margin-bottom:10px}
  #faces .faces{margin:0}
  #step{margin-bottom:12px}
  #step .step{margin-top:0}
  #right{flex:1;justify-content:flex-start}
  /* 右区一屏就这么高，每一处都收一点 */
  #faces{margin-bottom:6px !important}
  #step{margin-bottom:8px !important}
  #right .cardHead{margin-bottom:8px}
  #right .row{padding:10px 18px;margin-bottom:7px}
  /* 「今天不做」标题和条目并成一行 */
  #family .laterBlock{margin-top:4px;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 14px;padding:0 5px}
  #family .laterBlock .smallHead{margin:0}
  #family #later{display:flex;flex-wrap:wrap;gap:0 14px}
  /* 右区窄了，卡片的小字不许折行——电视 app 里本来就只显示一行 */
  #right .note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #right .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #right .row > div{min-width:0}          /* 弹性盒里的文字要能被截断，得先允许它比内容窄 */
  #right .memItem{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #detail{z-index:2}
</style>
</head>
<body data-part="day">

<div id="tv">
  <!--
    左右两区。
    左边是一扇窗：时辰、天气、在哪儿，都在这里面；老虎也住在这里面，
    它说的那句话做成一个小气泡跟着它——话是它说的。
    右边是家里的事：谁、今天这一步、今天的事、还在推的、记着的。
    景色不再被字盖着；右边也不必拉满，留白是给眼睛的。
  -->
  <div id="scene">
    <div id="art"></div><div id="scrim"></div>
    <div class="sceneTop">
      <div class="clock" id="clock"></div>
      <div class="date" id="date"></div>
      <div id="wx"></div>
    </div>
    <div class="sceneBottom">
      <img id="big" alt="">
      <div class="bubble"><p class="say" id="say"></p></div>
    </div>
  </div>
  <img class="tiger" id="tiger" src="/today-tiger.png" alt="" hidden>

  <div id="family">
    <div id="faces"></div>
    <div id="step"></div>
    <div id="right"></div>
    <div class="laterBlock" id="laterBlock" hidden>
      <div class="smallHead" id="laterHead"></div>
      <div id="later"></div>
    </div>
  </div>

  <div id="detail">
    <div class="left">
      <img class="tiger" src="/today-tiger.png" alt="">
      <div class="dTitle" id="dTitle"></div>
      <div class="tags" id="dTags"></div>
      <div class="close" id="dClose"></div>
    </div>
    <div class="right" style="justify-content:flex-start;padding-top:8px" id="dBody"></div>
  </div>
</div>

<div class="hint" id="hint"></div>

<script>
const $ = id => document.getElementById(id);
let turn = {say:'', cards:[], projects:[]};
let lang = (navigator.language||'en').toLowerCase().startsWith('zh') ? 'zh' : 'en';
let picked = 0;          // 第几个能按进去的东西
let openOn = null;

/* 和 src/agent/guide.js 同一套规则。两块屏不该长得不一样——
   这页是独立 HTML，没法 import，所以照抄一份；改一处要记得改两处。 */
const ICONS = [
  [['for you','for her','yourself','对你','给你','你自己'], '\u2615'],
  [['when','time','hour','open','时间','几点','营业','开门'], '\u{1F550}'],
  [['cost','price','fee','ticket','价','票','费用','多少钱'], '\u{1F3F7}\uFE0F'],
  [['suit','age','who','适合','岁','年龄'], '\u{1F9D2}'],
  [['travel','how','get','bus','car','walk','怎么去','交通','多远'], '\u{1F68C}'],
  [['where','place','address','area','在哪','地址','位置'], '\u{1F4CD}'],
  [['book','need','bring','note','要带','需要','预约'], '\u{1F4DD}'],
  [['vibe','what','like','什么样','感觉'], '\u2726'],
];
const iconFor = k => {
  const x = String(k||'').toLowerCase();
  for (const [ws, ic] of ICONS) if (ws.some(w => x.includes(w))) return ic;
  return '';
};
const isHers = k => ['for you','for her','yourself','对你','给你','你自己']
  .some(w => String(k||'').toLowerCase().includes(w));

const T = {
  zh:{today:'今天', notToday:'今天不做', remember:'我还记着', empty:'今天还没理。',
      left:n=>`还剩 ${n} 件`, allDone:'都做完了',
      step:'今天这一步，我替你推', stepHers:'今天这一步，是你自己的事',
      guide:'我替你查到的', checked:'查过了，出门前再确认一次时间和价格',
      carrying:'还在推着的',
      steps:'这件事是这么拆的', done:'已经做掉的', asked:'我问过你，还没答',
      waited:d=>`搁了 ${d} 天`, hers:'这是你自己的事', close:'按 Esc 收起',
      hint:'← → 选，Enter 按进去，Esc 退出'},
  en:{today:'TODAY', notToday:'Not today', remember:'I also remember', empty:"Today isn't sorted yet.",
      left:n=>n===1?'1 left':`${n} left`, allDone:'All done',
      step:"TODAY'S ONE STEP — I'M MOVING IT", stepHers:"TODAY'S ONE STEP — THIS ONE IS YOURS",
      guide:'What I found for you', checked:'Looked up — check times and prices again before you set out',
      carrying:'Still going',
      steps:'How this breaks down', done:'Already done', asked:"I asked you this, and you haven't said",
      waited:d=>`Waiting ${d} days`, hers:'This one is yours', close:'Press Esc to close',
      hint:'← → to move, Enter to open, Esc to close'},
};
const X = () => T[lang];

/* 窗口多大都按 16:9 缩放。看到的要是一台电视，不是一个会变形的网页。 */
function fit(){
  const k = Math.min(innerWidth/960, innerHeight/540);
  $('tv').style.transform = `translate(-50%,-50%) scale(${k})`;
}
addEventListener('resize', fit); fit();

/* ?part=night&sky=snow：直接看某个时辰、某种天气下的那扇窗。
   拍画廊、录演示用；评委也可以自己翻着看十六种窗是什么样。不带参数就跟着真时间走。 */
const Q = new URLSearchParams(location.search);
const PARTS = ['dawn','day','dusk','night'], SKIES = ['clear','cloud','rain','snow'];
const forcePart = PARTS.includes(Q.get('part')) ? Q.get('part') : null;
const forceSky  = SKIES.includes(Q.get('sky'))  ? Q.get('sky')  : null;
const part = h => forcePart || (h>=5&&h<9 ? 'dawn' : h>=9&&h<16 ? 'day' : h>=16&&h<20 ? 'dusk' : 'night');
const two = n => String(n).padStart(2,'0');

/* 窗景挑哪一张：时辰 × 天气。和 src/theme.ts 的 sceneOf 一模一样。 */
const skyOf = k => k==='clear' ? 'clear' : k==='snow' ? 'snow'
  : (k==='rain'||k==='drizzle'||k==='storm') ? 'rain' : 'cloud';
let artShown = '', artBad = new Set();
function art(){
  const name = `${part(new Date().getHours())}-${forceSky || skyOf(turn && turn.weather && turn.weather.kind)}`;
  if (name === artShown || artBad.has(name)) return;
  // 先在后台加载完再换，换的时候淡入——不让一块屏在客厅里闪一下
  const img = new Image();
  img.onload = () => {
    $('art').style.backgroundImage = `url(/art/${name}.jpg)`;
    $('tv').classList.add('art');
    artShown = name;
  };
  img.onerror = () => { artBad.add(name); if (!artShown) $('tv').classList.remove('art'); };
  img.src = `/art/${name}.jpg`;
  tiger();
}

/* 老虎跟着窗外换姿势：入夜打盹、下雨撑伞、下雪围围巾。和 src/theme.ts 的 poseOf 一样。 */
const ASPECT = {umbrella:.88, scarf:.78, sleep:.8};
function tiger(){
  const p = part(new Date().getHours());
  const sky = forceSky || skyOf(turn && turn.weather && turn.weather.kind);
  const pose = p==='night' ? 'sleep' : sky==='rain' ? 'umbrella' : sky==='snow' ? 'scarf' : null;
  const t = $('tiger');
  const want = pose ? `/art/tiger-${pose}.png` : '/today-tiger.png';
  if ($('big').getAttribute('src') !== want) {
    $('big').onerror = () => { $('big').onerror = null; $('big').src = '/today-tiger.png'; };
    $('big').src = want;
  }
  if (t.getAttribute('src') === want) return;
  t.onerror = () => { t.onerror = null; t.src = '/today-tiger.png'; t.style.width = ''; };
  t.src = want;
  t.style.width = pose ? `${Math.round(86*ASPECT[pose])}px` : '';
}

function clock(){
  const d = new Date();
  $('clock').textContent = `${d.getHours()}:${two(d.getMinutes())}`;
  const wd = lang==='zh'
    ? ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]
    : ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
  $('date').textContent = lang==='zh'
    ? `${d.getMonth()+1} 月 ${d.getDate()} 日 · ${wd}`
    : `${['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()]} ${d.getDate()} · ${wd}`;
  document.body.dataset.part = part(d.getHours());
  art();
}

/* 天气那一句。和 src/agent/weather.js 同一套判断——两块屏不该说得不一样。 */
function wxText(w){
  if (!w) return null;
  const zh = lang==='zh';
  const W = {clear:['晴','Clear'],cloud:['多云','Cloudy'],fog:['有雾','Fog'],
             drizzle:['小雨','Drizzle'],rain:['有雨','Rain'],snow:['有雪','Snow'],storm:['雷雨','Storms']};
  const word = (W[w.kind]||W.cloud)[zh?0:1];
  const r = w.low!=null && w.high!=null ? `${Math.round(w.low)}°–${Math.round(w.high)}°`
          : w.now!=null ? `${Math.round(w.now)}°` : '';
  let hint = '';
  const wet = ['rain','storm','drizzle'].includes(w.kind) || (w.rainChance??0)>=50;
  if (w.kind==='storm') hint = zh?'有雷雨，出门前再看一眼':'Storms about — check before you set out';
  else if (wet) hint = zh?'会下雨，伞放门口':'Rain today — umbrella by the door';
  else if (w.kind==='snow') hint = zh?'有雪，路上留神':'Snow — mind the pavements';
  else if (w.low!=null && w.low<=5) hint = zh?'早上冷，外套厚一点':'Cold this morning — the thicker coat';
  else if (w.high!=null && w.high>=30) hint = zh?'今天热，水带够':'Hot today — take enough water';
  else if (w.kind==='fog') hint = zh?'有雾，出门早一点':'Fog — leave a little earlier';
  return {line:[word,r].filter(Boolean).join(' · '), hint};
}

/* 大屏上只放得下开头一两句，断在句读上——完整那段在手机里。 */
function glance(s, max=108){
  const t = (s||'').trim();
  if (t.length<=max) return t;
  const c = t.slice(0,max);
  const e = Math.max(c.lastIndexOf('。'), c.lastIndexOf('. '), c.lastIndexOf('！'), c.lastIndexOf('？'), c.lastIndexOf('? '));
  if (e > max*0.4) return c.slice(0,e+1).trim();
  const sp = c.lastIndexOf(' ');
  return (sp>max*0.5 ? c.slice(0,sp) : c).trimEnd()+'…';
}

const tidy = v => String(v||'').replace(/[\s·,.，。、:：]/g,'').toLowerCase();
const projectFor = label => {
  const a = tidy(label), ps = turn.projects||[];
  return ps.find(q=>tidy(q.title)===a)
      ?? ps.find(q=>tidy(q.title).includes(a)||a.includes(tidy(q.title)))
      ?? null;
};
const deep = p => !!(p && (p.steps?.length || p.asked || p.guide?.options?.length));

/** 能按进去的东西，按屏幕上从上到下的顺序。 */
/*
 * 「今天不做」里要摆哪几条。
 * 右栏已经在摆「还在推着的」时，同一件事别再列一遍——同一屏上同样的字出现两次，
 * 看着像坏了（和 App.tsx 的 laterShown 一样）。渲染和遥控器导航用的是同一份，
 * 下标才对得上：以前今天没理的时候，导航列表里压根没有这几条，
 * 点「今天不做」第一条，开出来的是右栏第一张卡。
 */
function laterList(){
  const tasks = (turn.cards||[]).find(c=>c.type==='tasks');
  const carrying = !tasks?.items?.length;
  const shown = new Set(carrying ? (turn.projects||[]).slice(0,3).map(q=>tidy(q.title)) : []);
  const later = (turn.cards||[]).find(c=>c.type==='later');
  return (later?.items||[]).filter(l=>!shown.has(tidy(l))).slice(0,3);
}

function targets(){
  const out = [];
  const tasks = (turn.cards||[]).find(c=>c.type==='tasks');
  // 今天还没理的时候，右栏摆的是在推着的事——那几行才是能按的
  if (!tasks?.items?.length && (turn.projects||[]).length) {
    for (const q of (turn.projects||[]).slice(0,3))
      out.push({kind:'carry', label:q.title, forHer:q.forHer, project:q, can:deep(q)});
  } else {
    for (const t of tasks?.items ?? []) {
      const p = projectFor(t.label);
      out.push({kind:'task', label:t.label, note:t.note, forHer:t.forHer, project:p, can:deep(p)});
    }
  }
  for (const l of laterList()) {
    const p = projectFor(l);
    out.push({kind:'later', label:l, project:p, can:deep(p)});
  }
  return out;
}

/* 这一行说的是谁。只认名字，不猜；「给你自己的」不挂（那件已经有杏色边了）。 */
const esc = v => v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function whoIn(label){
  return (turn.family||[]).find(f => new RegExp(`\\b${esc(f.name)}\\b`,'i').test(label));
}
function faceImg(f, cls){
  const i = document.createElement('img');
  i.className = cls; i.src = `/art/avatar-${f.avatar}.jpg`; i.alt = f.name;
  i.style.borderColor = f.color;
  i.onerror = () => i.remove();
  return i;
}
function faces(){
  const box = document.createElement('div'); box.className = 'faces';
  (turn.family||[]).slice(0,6).forEach(f=>{
    const w = document.createElement('div'); w.className='fam';
    const n = document.createElement('span'); n.textContent = f.name;
    w.append(faceImg(f,'face'), n); box.append(w);
  });
  return box;
}

function draw(){
  const el = (c,t='div')=>{const e=document.createElement(t);e.className=c;return e;};
  // 右栏会被清空重画，「今天不做」先挪出来，画完再插回卡片和「我记着的」之间
  $('family').append($('laterBlock'));
  // 家里人那一排：右区最上面
  $('faces').innerHTML = ''; if ((turn.family||[]).length) $('faces').append(faces());
  $('say').textContent = glance(turn.say) || X().empty;
  art();

  const w = wxText(turn.weather);
  $('wx').innerHTML = '';
  if (w){
    const a = el('wxline'); a.textContent = w.line; $('wx').append(a);
    if (w.hint){ const b = el('wxhint'); b.textContent = w.hint; $('wx').append(b); }
  }

  // 今天这一步
  $('step').innerHTML = '';
  if (turn.step?.text){
    const box = el('step'+(turn.step.forHer?' hers':''));
    const h = el('stepHead'); h.textContent = turn.step.forHer ? X().stepHers : X().step;
    const t = el('stepText'); t.textContent = turn.step.text;
    box.append(h,t);
    if (turn.step.note){ const n = el('stepNote'); n.textContent = turn.step.note; box.append(n); }
    $('step').append(box);
  }

  const all = targets();
  if (picked >= all.length) picked = Math.max(0, all.length-1);

  // 右栏：今天
  const tasks = (turn.cards||[]).find(c=>c.type==='tasks');
  const items = tasks?.items ?? [];
  const left = items.filter(i=>!i.done).length;
  $('right').innerHTML = '';

  /* 今天还没理，但手上并不是空的。
     右边空着等于把昨天推着的事全藏起来，而那恰恰是早上第一眼该看见的。 */
  const carry = !items.length ? (turn.projects||[]).slice(0,3) : [];
  if (carry.length){
    const head = el('cardHead');
    const s1 = el('section'); s1.textContent = X().carrying; head.append(s1);
    $('right').append(head);
    carry.forEach((q,i)=>{
      const row = el('row'+(i===picked?' on':''));
      if (q.forHer) row.append(el('herEdge'));
      const col = el(''); col.style.flex='1';
      const lab = el('label'); lab.textContent = q.title; col.append(lab);
      const nx = (q.steps||[]).find(st=>!st.done)?.text || q.asked;
      if (nx){ const n=el('note'); n.textContent=nx; col.append(n); }
      row.append(col);
      { const f = !q.forHer && whoIn(q.title); if (f) row.append(faceImg(f,'who')); }
      if (i===picked && deep(q)){ const c=el('into'); c.textContent='\u203a'; row.append(c); }
      row.onclick = ()=>{ picked=i; if (deep(q)) show(all[i]); else draw(); };
      $('right').append(row);
    });
  }

  if (items.length){
    const head = el('cardHead');
    const s1 = el('section'); s1.textContent = X().today;
    const s2 = el('count'); s2.textContent = left===0 ? X().allDone : X().left(left);
    head.append(s1, s2); $('right').append(head);
    items.forEach((t,i)=>{
      const idx = i;
      const row = el('row'+(idx===picked?' on':''));
      if (t.forHer) row.append(el('herEdge'));
      const b = el('box'+(t.done?' done':'')); b.textContent = t.done?'✓':''; row.append(b);
      const col = el(''); col.style.flex='1';
      const lab = el('label'+(t.done?' done':'')); lab.textContent = t.label; col.append(lab);
      if (t.note){ const n = el('note'); n.textContent = t.note; col.append(n); }
      row.append(col);
      { const f = !t.forHer && whoIn(t.label); if (f) row.append(faceImg(f,'who')); }
      if (idx===picked && all[idx]?.can){ const c = el('into'); c.textContent='›'; row.append(c); }
      row.onclick = ()=>{ picked = idx; if (all[idx]?.can) show(all[idx]); else draw(); };
      $('right').append(row);
    });
  }

  // 我还记着
  const mem = (turn.cards||[]).find(c=>c.type==='memory');
  if (mem?.items?.length){
    const block = el('memBlock');
    const h = el('smallHead'); h.textContent = X().remember; block.append(h);
    // 右区一屏就这么高：卡片满三张的时候只留两行
    const rows = $('right').querySelectorAll('.row').length >= 3 ? 2 : 3;
    mem.items.slice(0,rows).forEach(m=>{const e=el('memItem');e.textContent=m.text;block.append(e);});
    $('right').append(block);
  }

  // 今天不做
  const laterItems = laterList();
  const base = all.filter(t=>t.kind!=='later').length;
  if (laterItems.length){
    $('laterBlock').hidden = false;
    $('laterHead').textContent = X().notToday;
    $('later').innerHTML = '';
    laterItems.forEach((l,i)=>{
      const idx = base+i;
      const can = all[idx]?.can;
      const e = el('laterItem'+(can?' can':'')+(idx===picked?' on':''));
      e.textContent = (idx===picked && can) ? `${l}  ›` : l;
      e.onclick = ()=>{ picked = idx; if (can) show(all[idx]); else draw(); };
      $('later').append(e);
    });
  } else $('laterBlock').hidden = true;
  { const mem = $('right').querySelector('.memBlock');
    mem ? $('right').insertBefore($('laterBlock'), mem) : $('right').append($('laterBlock')); }



  $('hint').textContent = X().hint;
}

function show(t){
  openOn = t;
  const p = t.project;
  const el = (c,tag='div')=>{const e=document.createElement(tag);e.className=c;return e;};
  $('dTitle').textContent = t.label;
  $('dClose').textContent = X().close;
  $('dTags').innerHTML = '';
  if (t.forHer || p?.forHer){ const a=el('tag hers'); a.textContent=X().hers; $('dTags').append(a); }
  if (p?.waited > 0){ const b=el('tag'); b.textContent=X().waited(p.waited); $('dTags').append(b); }

  const body = $('dBody'); body.innerHTML='';
  const steps = p?.steps ?? [];
  const next = steps.find(s=>!s.done);
  if (next){
    const box = el('step'+((t.forHer||p?.forHer)?' hers':''));
    const h=el('stepHead'); h.textContent = T[lang].step.replace(/，.*|—.*/,'');
    const x=el('stepText'); x.textContent = next.text; box.append(h,x);
    if (next.note){const n=el('stepNote');n.textContent=next.note;box.append(n);}
    body.append(box);
  }
  if (p?.guide?.options?.length){
    const h = el('smallHead'); h.textContent = X().guide; h.style.marginTop='13px'; body.append(h);
    // 多于一个方案才套卡。三米外三段一样的字是一堵墙，眼睛没有落点。
    const many = p.guide.options.length > 1;
    p.guide.options.slice(0,3).forEach(o=>{
      const card = el(many ? 'gcard' : '');
      const n = el('optName'); n.textContent = o.name; card.append(n);
      const f = el('facts');
      (o.facts||[]).slice(0,4).forEach(x=>{
        const mine = isHers(x.k), ic = iconFor(x.k);
        const e = el('fact' + (mine ? ' hers' : ''));
        if (ic) { const i = document.createElement('span'); i.textContent = ic + ' '; e.append(i); }
        const b = document.createElement('b'); b.textContent = x.k;
        e.append(b, document.createTextNode(x.v)); f.append(e);
      });
      card.append(f);
      if (o.note){ const nt=el('optNote'); nt.textContent=o.note; card.append(nt); }
      body.append(card);
    });
    const c = el('optNote'); c.textContent = X().checked; c.style.marginTop='8px'; body.append(c);
  }
  const rest = steps.filter(s=>!s.done && s!==next);
  if (rest.length){
    const h=el('smallHead'); h.textContent=X().steps; h.style.marginTop='13px'; body.append(h);
    rest.slice(0,4).forEach(s=>{const e=el('fact');e.textContent='·  '+s.text;body.append(e);});
  }
  const done = steps.filter(s=>s.done);
  if (done.length){
    const h=el('smallHead'); h.textContent=X().done; h.style.marginTop='13px'; body.append(h);
    done.slice(0,3).forEach(s=>{const e=el('fact struck');e.textContent='✓  '+s.text;body.append(e);});
  }
  $('detail').classList.add('on');
  $('main').style.visibility='hidden';
}
function hide(){ openOn=null; $('detail').classList.remove('on'); $('main').style.visibility='visible'; draw(); }

addEventListener('keydown', e=>{
  if (e.key==='Escape'){ if (openOn) hide(); return; }
  if (openOn) return;
  const all = targets();
  if (e.key==='ArrowDown'||e.key==='ArrowRight'){ picked=Math.min(all.length-1,picked+1); draw(); }
  if (e.key==='ArrowUp'||e.key==='ArrowLeft'){ picked=Math.max(0,picked-1); draw(); }
  if (e.key==='Enter'){ const t=all[picked]; if (t?.can) show(t); }
});

async function pull(){
  try{
    const r = await fetch('/turn');
    if (!r.ok) return;
    turn = await r.json();
    if (turn.lang==='zh'||turn.lang==='en') lang = turn.lang;
    else {
      const body = (turn.say||'') + JSON.stringify(turn.cards||'');
      if (/[一-龥]/.test(body)) lang='zh';
    }
    document.documentElement.lang = lang==='zh'?'zh-CN':'en';
    if (!openOn) draw();
  }catch{}
}
clock(); setInterval(clock, 10000);
pull();  setInterval(pull, 5000);
</script>
