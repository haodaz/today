<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBF4EE">
<title>Today</title>
<style>
  /*
   * 手机端按应用来做，不是网页。
   * 语言取自同类可信赖产品（蚂蚁阿福这一类）：柔和渐变底、角色在场、
   * 毛玻璃卡片、底部常驻的输入条。
   *
   * 底部那条是关键：它一直在，但很薄、很安静。
   * 「点一下才出来一个大白框」是在索取；一条安静的输入条是在等着。
   */
  :root{
    --ember:#C2703D; --ember-deep:#A85C2E; --ember-tint:#F6E3D5;
    --ink:#231E1A; --soft:#6B625B; --faint:#A39A92;
    --glass:rgba(255,255,255,.78);
    --line:rgba(194,112,61,.14);
    --shadow:0 8px 28px rgba(194,112,61,.10);
    --shadow-lift:0 12px 34px rgba(194,112,61,.16);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ember:#E09A68; --ember-deep:#C2703D; --ember-tint:#3A2A1F;
      --ink:#F2EDE8; --soft:#B3A99F; --faint:#7D736B;
      --glass:rgba(38,33,30,.72);
      --line:rgba(224,154,104,.16);
      --shadow:0 8px 28px rgba(0,0,0,.34);
      --shadow-lift:0 12px 34px rgba(0,0,0,.44);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{
    color:var(--ink);
    font:400 17px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    display:flex;flex-direction:column;
    /* 柔和渐变底，不是一块平灰 */
    background:
      radial-gradient(120% 60% at 85% 0%, rgba(194,112,61,.13), transparent 60%),
      radial-gradient(90% 50% at 0% 12%, rgba(194,112,61,.07), transparent 55%),
      linear-gradient(170deg,#FBF4EE 0%,#F6F1EC 46%,#F3F1EE 100%);
  }
  @media (prefers-color-scheme: dark){
    body{background:
      radial-gradient(120% 60% at 85% 0%, rgba(224,154,104,.12), transparent 60%),
      linear-gradient(170deg,#1C1816 0%,#191715 100%);}
  }

  /* ── Today 在场 ───────────────────────────── */
  header{
    padding:max(14px,env(safe-area-inset-top)) 20px 4px;
    display:flex;gap:14px;align-items:flex-end;flex:0 0 auto;
  }
  .tiger{
    width:118px;height:auto;flex:0 0 auto;margin-bottom:-6px;
    filter:drop-shadow(0 10px 18px rgba(194,112,61,.20));
    transition:opacity .3s, transform .3s;
  }
  .tiger.thinking{opacity:.55;transform:translateY(2px) scale(.98)}
  .hello{flex:1;padding-bottom:10px;min-width:0}
  .brand{font-size:11px;letter-spacing:.22em;color:var(--faint);font-weight:600;margin:0 0 5px}
  .say{font-size:21px;font-weight:400;line-height:1.42;margin:0;letter-spacing:.01em}
  .say.pending{color:var(--faint)}

  /* ── 卡片区 ───────────────────────────────── */
  main{flex:1;overflow-y:auto;padding:14px 20px 8px;-webkit-overflow-scrolling:touch}
  .card{
    background:var(--glass);
    -webkit-backdrop-filter:blur(20px) saturate(1.6);
    backdrop-filter:blur(20px) saturate(1.6);
    border:1px solid var(--line);
    border-radius:24px;
    padding:17px 19px;margin-bottom:11px;
    box-shadow:var(--shadow);
    display:flex;gap:14px;align-items:flex-start;
    position:relative;overflow:hidden;
    animation:rise .34s cubic-bezier(.2,.7,.3,1) backwards;
  }
  .card:nth-child(2){animation-delay:.05s}
  .card:nth-child(3){animation-delay:.1s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  /* 「给她自己的」那件：一道暖色边。不写字，说出来就变成施舍了。 */
  .card.her{box-shadow:var(--shadow-lift)}
  .card.her::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
    background:linear-gradient(180deg,var(--ember),var(--ember-deep))}
  .box{flex:0 0 auto;width:23px;height:23px;border:2px solid var(--line);
    border-radius:8px;margin-top:3px;background:rgba(255,255,255,.4)}
  .lab{font-size:17.5px;font-weight:500;letter-spacing:.01em}
  .sub{font-size:13.5px;color:var(--faint);margin-top:3px}

  .quiet-h{margin:18px 4px 8px;font-size:11px;letter-spacing:.16em;color:var(--faint);font-weight:600}
  .quiet{display:flex;flex-wrap:wrap;gap:7px;margin:0 2px}
  .chip{
    font-size:13.5px;color:var(--soft);
    background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  }

  /* ── 底部常驻输入条 ───────────────────────── */
  footer{
    flex:0 0 auto;padding:8px 16px max(14px,env(safe-area-inset-bottom));
  }
  .bar{
    display:flex;align-items:center;gap:10px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(24px) saturate(1.7);
    backdrop-filter:blur(24px) saturate(1.7);
    border:1px solid var(--line);border-radius:999px;
    padding:7px 7px 7px 20px;box-shadow:var(--shadow);
  }
  .bar input{
    flex:1;min-width:0;border:0;background:transparent;outline:none;
    font:inherit;font-size:16px;color:var(--ink);padding:9px 0;
  }
  .bar input::placeholder{color:var(--faint)}
  .mic{
    flex:0 0 auto;width:44px;height:44px;border:0;border-radius:50%;
    background:linear-gradient(145deg,var(--ember),var(--ember-deep));
    color:#fff;display:grid;place-items:center;
    box-shadow:0 4px 14px rgba(194,112,61,.34);
    transition:transform .12s, box-shadow .2s;
  }
  .mic:active{transform:scale(.93)}
  .mic.on{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{
    0%,100%{box-shadow:0 4px 14px rgba(194,112,61,.34)}
    50%{box-shadow:0 4px 14px rgba(194,112,61,.34),0 0 0 11px rgba(194,112,61,.12)}
  }
  .mic svg{width:21px;height:21px;fill:currentColor}

  /* 录音态把输入条换成电平条 */
  .level{flex:1;height:5px;border-radius:3px;background:var(--ember-tint);overflow:hidden;margin:0 2px}
  .level span{display:block;height:100%;width:0;background:var(--ember);transition:width .07s linear}
  .ghost{flex:0 0 auto;border:0;background:transparent;color:var(--soft);
    font:inherit;font-size:15px;padding:10px 8px}

  .err{margin:8px 20px 0;font-size:14px;color:#B3261E}
  [hidden]{display:none !important}
</style>
</head>
<body>

<header>
  <!-- 捧着的那只：两爪收在胸前、目光微微向下，不盯着人。
       这个姿势本身就是「我替你记着」。 -->
  <img class="tiger" id="tiger" src="/today-tiger.png" alt="">
  <div class="hello">
    <p class="brand">TODAY</p>
    <p class="say pending" id="say"></p>
  </div>
</header>

<main id="cards"></main>
<p class="err" id="err" hidden></p>

<footer>
  <!-- 常态：一条安静的输入条。一直在，但不索取。 -->
  <div class="bar" id="bar">
    <input id="t" autocomplete="off">
    <button class="mic" id="mic" aria-label="说">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
    </button>
  </div>
  <!-- 录音态 -->
  <div class="bar" id="recbar" hidden>
    <div class="level"><span id="lv"></span></div>
    <button class="ghost" id="drop"></button>
    <button class="mic on" id="stop" aria-label="说完了">
      <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
    </button>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
const DICT = {
  zh: {ph:'说点什么，或者按右边说话', drop:'算了', hearing:'我在听…', taking:'我记一下…',
       quiet:'我先收着', err:'没弄成：', fallback:'我在。',
       noMic:'这台设备不让网页用麦克风，直接打字吧。'},
  en: {ph:'Type, or hold the mic', drop:'Never mind', hearing:'Listening…', taking:'Taking that in…',
       quiet:"I'm keeping these", err:"Didn't work: ", fallback:"I'm here.",
       noMic:"This device won't give the page a microphone. Type instead."},
};
const LANG = (navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en';
const X = DICT[LANG];
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
$('t').placeholder = X.ph;
$('drop').textContent = X.drop;

const setSay = (t, pending) => {
  $('say').textContent = t;
  $('say').classList.toggle('pending', !!pending);
};
const thinking = on => $('tiger').classList.toggle('thinking', on);
const showErr = m => { $('err').textContent = X.err + String(m).slice(0,150); $('err').hidden = false; };

/* Today 先开口。这句话是它生成的，用它记得的东西说一句只有它能说的话。 */
(async () => {
  try {
    const {say} = await (await fetch(`/greet?lang=${LANG}`)).json();
    setSay(say || X.fallback);
  } catch { setSay(X.fallback); }
  try { render(await (await fetch('/turn')).json(), true); } catch {}
})();

/* ── 录音 ─────────────────────────────────────
   不依赖键盘的听写键：很多手机没有那个键。
   getUserMedia 要安全上下文，所以这页必须走 HTTPS。
   ──────────────────────────────────────────── */
let rec = null, chunks = [], meter = null;

$('mic').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    const mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4']
      .find(m => window.MediaRecorder?.isTypeSupported?.(m));
    rec = new MediaRecorder(stream, mime ? {mimeType: mime} : undefined);
    chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      meter?.ctx.close().catch(()=>{}); meter = null;
      $('lv').style.width = '0%';
      sendAudio(new Blob(chunks, {type: rec.mimeType || 'audio/webm'}));
    };
    rec.start();
    level(stream);
    $('bar').hidden = true; $('recbar').hidden = false;
    $('err').hidden = true;
    setSay(X.hearing, true);
  } catch { showErr(X.noMic); $('t').focus(); }
};
$('stop').onclick = () => rec?.state === 'recording' && rec.stop();
$('drop').onclick = () => {
  if (rec?.state === 'recording') { chunks = []; rec.onstop = null; rec.stop(); }
  meter?.ctx.close().catch(()=>{}); meter = null; rec = null;
  $('recbar').hidden = true; $('bar').hidden = false;
  setSay('');
};

/** 电平条。只是让她知道「它确实在收」，不画波形。 */
function level(stream) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const an = ctx.createAnalyser(); an.fftSize = 256;
    ctx.createMediaStreamSource(stream).connect(an);
    const buf = new Uint8Array(an.frequencyBinCount);
    meter = {ctx};
    (function tick(){
      if (!meter) return;
      an.getByteTimeDomainData(buf);
      let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v-128));
      $('lv').style.width = Math.min(100, (peak/58)*100) + '%';
      requestAnimationFrame(tick);
    })();
  } catch {}
}

async function sendAudio(blob) {
  $('recbar').hidden = true; $('bar').hidden = false;
  setSay(X.taking, true); thinking(true);
  try {
    const r = await fetch('/transcribe', {method:'POST', headers:{'Content-Type': blob.type||'audio/webm'}, body: blob});
    if (!r.ok) throw new Error(await r.text());
    const {text} = await r.json();
    if (!text) throw new Error('没听清');
    render(await submit(text));
  } catch (e) { showErr(e.message || e); setSay(''); }
  finally { thinking(false); rec = null; }
}

/** 说的和打的走同一条路：到这里都只是一段文字。 */
const submit = async text => {
  const r = await fetch('/braindump', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({braindump: text, lang: LANG}),
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
};

$('t').addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const text = $('t').value.trim();
  if (!text) return;
  $('t').value = ''; $('t').blur();
  setSay(X.taking, true); thinking(true); $('err').hidden = true;
  try { render(await submit(text)); }
  catch (err) { showErr(err.message || err); setSay(''); }
  finally { thinking(false); }
});

function render(turn, quiet) {
  if (!quiet) setSay(turn.say || '');
  const box = $('cards');
  box.innerHTML = '';
  for (const c of turn.cards || []) {
    if (c.type === 'tasks') {
      for (const t of c.items) {
        const el = document.createElement('div');
        el.className = 'card' + (t.forHer ? ' her' : '');
        el.innerHTML = '<div class="box"></div><div style="min-width:0"><div class="lab"></div>' +
                       (t.note ? '<div class="sub"></div>' : '') + '</div>';
        // textContent 填值，不把模型输出当 HTML 解析
        el.querySelector('.lab').textContent = t.label;
        if (t.note) el.querySelector('.sub').textContent = t.note;
        box.appendChild(el);
      }
    } else if (c.type === 'later' && c.items.length) {
      const h = document.createElement('div');
      h.className = 'quiet-h'; h.textContent = X.quiet;
      const wrap = document.createElement('div');
      wrap.className = 'quiet';
      for (const s of c.items) {
        const chip = document.createElement('span');
        chip.className = 'chip'; chip.textContent = s;
        wrap.appendChild(chip);
      }
      box.append(h, wrap);
    }
  }
}
</script>
</body>
</html>
