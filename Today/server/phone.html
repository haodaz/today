<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Today</title>
<style>
  /* 和电视端同一套：中性灰 + 一个暖色。
     这一页只有一个角色和一件事，所以没有导航、没有标题栏、没有别的入口。 */
  :root{
    --bg:#F5F5F4; --surface:#FFF; --border:#E4E4E2;
    --text:#1C1D1C; --soft:#57595A; --faint:#95989A;
    --ember:#C2703D;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17161A; --surface:#1F1E23; --border:#2E2C32;
      --text:#EDEAE6; --soft:#A7A29C; --faint:#6E6A66; --ember:#D98B5A;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font:400 17px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    display:flex; flex-direction:column;
    padding:max(18px,env(safe-area-inset-top)) 20px max(18px,env(safe-area-inset-bottom));
  }

  /* Today 本人。它在那儿，先开口，然后等着。
     输入不摊在页面上要求她填——那是另一件事，由她触发。 */
  .today{display:flex;gap:14px;align-items:flex-start;padding:6px 2px 0}
  .tiger{width:76px;height:auto;flex:0 0 auto;margin-top:-6px;transition:opacity .25s}
  .tiger.thinking{opacity:.45}
  .say{font-size:23px;font-weight:300;line-height:1.45;margin:6px 0 0;min-height:1.45em}
  .say.pending{color:var(--faint)}

  main{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-top:18px}

  /* 卡片。结构化的东西走卡片，不塞进对话里让人去读。 */
  .cards{overflow:auto;margin-bottom:8px}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:15px 17px;margin-bottom:9px;position:relative;overflow:hidden;
    display:flex;gap:13px;align-items:flex-start;
  }
  .card.her::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ember)}
  .box{flex:0 0 auto;width:21px;height:21px;border:2px solid var(--border);border-radius:7px;margin-top:2px}
  .lab{font-size:17px;font-weight:500}
  .sub{font-size:13.5px;color:var(--faint);margin-top:2px}
  .quiet-h{margin:16px 2px 6px;font-size:12px;letter-spacing:.1em;color:var(--faint)}
  .quiet{margin:0 2px;color:var(--faint);font-size:14.5px;line-height:1.9}

  /* 触发区 */
  .act{display:flex;gap:10px;padding-top:4px}
  button{
    flex:1;padding:16px;border:0;border-radius:15px;
    font:600 17px/1 inherit;letter-spacing:.01em;
    background:var(--ember);color:#fff;transition:opacity .15s,transform .08s;
  }
  button:active{transform:scale(.985)}
  button:disabled{opacity:.45}
  button.ghost{flex:0 0 auto;padding:16px 20px;background:transparent;color:var(--soft);border:1px solid var(--border);font-weight:500}

  textarea{
    width:100%;min-height:150px;resize:none;margin-bottom:10px;
    background:var(--surface);color:var(--text);
    border:1px solid var(--ember);border-radius:16px;
    padding:16px;font:inherit;line-height:1.7;outline:none;
  }
  textarea::placeholder{color:var(--faint)}
  .hint{margin:0 2px 10px;font-size:13.5px;color:var(--faint)}
  .err{color:#B3261E;font-size:14.5px;margin:8px 2px 0}
  [hidden]{display:none !important}
</style>
</head>
<body>

<div class="today">
  <img class="tiger" id="tiger" src="/today-listening.png" alt="">
  <p class="say pending" id="say"></p>
</div>

<main>
  <div class="cards" id="cards"></div>

  <!-- 常态：Today 在那儿，她想说的时候才触发 -->
  <div class="act" id="rest">
    <button id="talk"></button>
  </div>

  <!-- 她触发之后 -->
  <div id="compose" hidden>
    <textarea id="t" rows="6"></textarea>
    <p class="hint" id="hint"></p>
    <div class="act">
      <button id="send"></button>
      <button class="ghost" id="cancel"></button>
    </div>
  </div>

  <p class="err" id="err" hidden></p>
</main>

<script>
const $ = id => document.getElementById(id);

const DICT = {
  zh: {
    talk: '跟它说说今天', send: '说完了', sending: '它在听…', cancel: '算了',
    ph: '想到什么说什么，不用整理。',
    hint: '可以直接说，也可以打字。',
    quiet: '我先收着', err: '没弄成：',
    fallback: '我在。',
  },
  en: {
    talk: 'Tell it about today', send: "That's everything", sending: 'Listening…', cancel: 'Never mind',
    ph: 'Say it however it comes. No need to sort it out.',
    hint: 'Speak it or type it, whichever is easier.',
    quiet: "I'm keeping these", err: "Didn't work: ",
    fallback: "I'm here.",
  },
};
const LANG = (navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en';
const X = DICT[LANG];
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
$('talk').textContent = X.talk;
$('send').textContent = X.send;
$('cancel').textContent = X.cancel;
$('t').placeholder = X.ph;
$('hint').textContent = X.hint;

/* Today 先开口。
   这句话是它生成的，不是写死的标语——它用它记得的东西说一句只有它能说的话。
   拿不到就退回一句最短的，不让它挡住她。 */
(async () => {
  try {
    const r = await fetch(`/greet?lang=${LANG}`);
    const {say} = await r.json();
    setSay(say || X.fallback);
  } catch { setSay(X.fallback); }
})();

function setSay(text, pending) {
  $('say').textContent = text;
  $('say').classList.toggle('pending', !!pending);
}
const thinking = on => $('tiger').classList.toggle('thinking', on);

$('talk').onclick = () => {
  $('rest').hidden = true;
  $('compose').hidden = false;
  $('t').focus();
};
$('cancel').onclick = () => {
  $('compose').hidden = true;
  $('rest').hidden = false;
  $('t').value = '';
};

$('send').onclick = async () => {
  const text = $('t').value.trim();
  if (!text) { $('t').focus(); return; }
  $('send').disabled = true;
  $('send').textContent = X.sending;
  $('err').hidden = true;
  thinking(true);
  try {
    const r = await fetch('/braindump', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({braindump: text, lang: LANG}),
    });
    if (!r.ok) throw new Error(await r.text());
    render(await r.json());
    $('compose').hidden = true;
    $('rest').hidden = false;
    $('t').value = '';
  } catch (e) {
    $('err').textContent = X.err + String(e.message || e).slice(0, 160);
    $('err').hidden = false;
  } finally {
    thinking(false);
    $('send').disabled = false;
    $('send').textContent = X.send;
  }
};

function render(turn) {
  setSay(turn.say || '');
  const box = $('cards');
  box.innerHTML = '';

  for (const c of turn.cards || []) {
    if (c.type === 'tasks') {
      for (const t of c.items) {
        const el = document.createElement('div');
        el.className = 'card' + (t.forHer ? ' her' : '');
        el.innerHTML = '<div class="box"></div><div><div class="lab"></div>' +
                       (t.note ? '<div class="sub"></div>' : '') + '</div>';
        // textContent 填值，不把模型输出当 HTML 解析
        el.querySelector('.lab').textContent = t.label;
        if (t.note) el.querySelector('.sub').textContent = t.note;
        box.appendChild(el);
      }
    } else if (c.type === 'later' && c.items.length) {
      const h = document.createElement('div');
      h.className = 'quiet-h'; h.textContent = X.quiet;
      const p = document.createElement('div');
      p.className = 'quiet'; p.textContent = c.items.join(' · ');
      box.append(h, p);
    }
  }
  box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
