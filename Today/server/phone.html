<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Today</title>
<style>
  /* 和电视端同一套：中性灰 + 一个暖色。
     这一页只有一个角色和一件事，所以没有导航、没有标题栏、没有别的入口。 */
  :root{
    --bg:#F5F5F4; --surface:#FFF; --border:#E4E4E2;
    --text:#1C1D1C; --soft:#57595A; --faint:#95989A;
    --ember:#C2703D;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17161A; --surface:#1F1E23; --border:#2E2C32;
      --text:#EDEAE6; --soft:#A7A29C; --faint:#6E6A66; --ember:#D98B5A;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font:400 17px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    display:flex; flex-direction:column;
    padding:max(18px,env(safe-area-inset-top)) 20px max(18px,env(safe-area-inset-bottom));
  }

  /* Today 本人。它在那儿，先开口，然后等着。
     输入不摊在页面上要求她填——那是另一件事，由她触发。 */
  .today{display:flex;gap:14px;align-items:flex-start;padding:6px 2px 0}
  .tiger{width:76px;height:auto;flex:0 0 auto;margin-top:-6px;transition:opacity .25s}
  .tiger.thinking{opacity:.45}
  .say{font-size:23px;font-weight:300;line-height:1.45;margin:6px 0 0;min-height:1.45em}
  .say.pending{color:var(--faint)}

  main{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-top:18px}

  /* 卡片。结构化的东西走卡片，不塞进对话里让人去读。 */
  .cards{overflow:auto;margin-bottom:8px}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:15px 17px;margin-bottom:9px;position:relative;overflow:hidden;
    display:flex;gap:13px;align-items:flex-start;
  }
  .card.her::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ember)}
  .box{flex:0 0 auto;width:21px;height:21px;border:2px solid var(--border);border-radius:7px;margin-top:2px}
  .lab{font-size:17px;font-weight:500}
  .sub{font-size:13.5px;color:var(--faint);margin-top:2px}
  .quiet-h{margin:16px 2px 6px;font-size:12px;letter-spacing:.1em;color:var(--faint)}
  .quiet{margin:0 2px;color:var(--faint);font-size:14.5px;line-height:1.9}

  /* 触发区 */
  .act{display:flex;gap:10px;padding-top:4px}
  button{
    flex:1;padding:16px;border:0;border-radius:15px;
    font:600 17px/1 inherit;letter-spacing:.01em;
    background:var(--ember);color:#fff;transition:opacity .15s,transform .08s;
  }
  button:active{transform:scale(.985)}
  button:disabled{opacity:.45}
  button.ghost{flex:0 0 auto;padding:16px 20px;background:transparent;color:var(--soft);border:1px solid var(--border);font-weight:500}

  textarea{
    width:100%;min-height:150px;resize:none;margin-bottom:10px;
    background:var(--surface);color:var(--text);
    border:1px solid var(--ember);border-radius:16px;
    padding:16px;font:inherit;line-height:1.7;outline:none;
  }
  textarea::placeholder{color:var(--faint)}
  .hint{margin:0 2px 10px;font-size:13.5px;color:var(--faint)}
  /* 录音时的音量条。不画波形——她不需要看自己的声音好不好看，
     只需要知道「它确实在收」。 */
  .level{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin:0 2px 12px}
  .level span{display:block;height:100%;width:0;background:var(--ember);transition:width .08s linear}
  .err{color:#B3261E;font-size:14.5px;margin:8px 2px 0}
  [hidden]{display:none !important}
</style>
</head>
<body>

<div class="today">
  <img class="tiger" id="tiger" src="/today-listening.png" alt="">
  <p class="say pending" id="say"></p>
</div>

<main>
  <div class="cards" id="cards"></div>

  <!-- 常态：Today 在那儿，她想说的时候才触发。
       主按钮是说话，不是打字——她手上多半抱着孩子。 -->
  <div class="act" id="rest">
    <button id="rec"></button>
    <button class="ghost" id="type"></button>
  </div>

  <!-- 录音中 -->
  <div id="recording" hidden>
    <p class="level"><span id="bar"></span></p>
    <p class="hint" id="recHint"></p>
    <div class="act">
      <button id="stop"></button>
      <button class="ghost" id="drop"></button>
    </div>
  </div>

  <!-- 她触发之后 -->
  <div id="compose" hidden>
    <textarea id="t" rows="6"></textarea>
    <p class="hint" id="hint"></p>
    <div class="act">
      <button id="send"></button>
      <button class="ghost" id="cancel"></button>
    </div>
  </div>

  <p class="err" id="err" hidden></p>
</main>

<script>
const $ = id => document.getElementById(id);

const DICT = {
  zh: {
    rec: '按住说，或点一下开始', type: '打字', stop: '说完了', drop: '算了',
    recording: '在听…', hearing: '它在听你说…',
    send: '说完了', sending: '它在听…', cancel: '算了',
    noMic: '这台设备不让网页用麦克风。先打字吧。',
    ph: '想到什么说什么，不用整理。',
    hint: '可以直接说，也可以打字。',
    quiet: '我先收着', err: '没弄成：',
    fallback: '我在。',
  },
  en: {
    rec: 'Hold to talk, or tap to start', type: 'Type', stop: "That's everything", drop: 'Never mind',
    recording: 'Listening…', hearing: 'Taking that in…',
    send: "That's everything", sending: 'Listening…', cancel: 'Never mind',
    noMic: "This device won't give the page a microphone. Type instead.",
    ph: 'Say it however it comes. No need to sort it out.',
    hint: 'Speak it or type it, whichever is easier.',
    quiet: "I'm keeping these", err: "Didn't work: ",
    fallback: "I'm here.",
  },
};
const LANG = (navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en';
const X = DICT[LANG];
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
$('rec').textContent = X.rec;
$('type').textContent = X.type;
$('stop').textContent = X.stop;
$('drop').textContent = X.drop;
$('recHint').textContent = X.recording;
$('send').textContent = X.send;
$('cancel').textContent = X.cancel;
$('t').placeholder = X.ph;
$('hint').textContent = X.hint;

/* Today 先开口。
   这句话是它生成的，不是写死的标语——它用它记得的东西说一句只有它能说的话。
   拿不到就退回一句最短的，不让它挡住她。 */
(async () => {
  try {
    const r = await fetch(`/greet?lang=${LANG}`);
    const {say} = await r.json();
    setSay(say || X.fallback);
  } catch { setSay(X.fallback); }
})();

function setSay(text, pending) {
  $('say').textContent = text;
  $('say').classList.toggle('pending', !!pending);
}
const thinking = on => $('tiger').classList.toggle('thinking', on);

$('type').onclick = () => {
  $('rest').hidden = true;
  $('compose').hidden = false;
  $('t').focus();
};

/* ── 录音 ──────────────────────────────────────────────────
   不依赖键盘的听写键：实测很多手机根本没有那个键。
   getUserMedia 需要安全上下文，所以这页必须走 HTTPS——
   局域网 http:// 下 iOS Safari 不会给麦克风权限。
   ─────────────────────────────────────────────────────── */
let rec = null, chunks = [], meter = null;

async function startRec() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    // iOS Safari 录 audio/mp4，安卓录 audio/webm，让浏览器自己挑
    const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4']
      .find(m => window.MediaRecorder?.isTypeSupported?.(m));
    rec = new MediaRecorder(stream, mime ? {mimeType: mime} : undefined);
    chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      if (meter) { meter.ctx.close().catch(() => {}); meter = null; }
      $('bar').style.width = '0%';
      send(new Blob(chunks, {type: rec.mimeType || 'audio/webm'}));
    };
    rec.start();
    level(stream);
    $('rest').hidden = true;
    $('recording').hidden = false;
    thinking(false);
  } catch (e) {
    $('err').textContent = X.noMic;
    $('err').hidden = false;
    $('type').click();
  }
}

/** 音量条。只是让她知道「它确实在收」，不画波形。 */
function level(stream) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const an = ctx.createAnalyser();
    an.fftSize = 256;
    ctx.createMediaStreamSource(stream).connect(an);
    const buf = new Uint8Array(an.frequencyBinCount);
    meter = {ctx};
    const tick = () => {
      if (!meter) return;
      an.getByteTimeDomainData(buf);
      let peak = 0;
      for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
      $('bar').style.width = Math.min(100, (peak / 60) * 100) + '%';
      requestAnimationFrame(tick);
    };
    tick();
  } catch {}
}

$('rec').onclick = () => { if (!rec || rec.state === 'inactive') startRec(); };
$('stop').onclick = () => rec?.state === 'recording' && rec.stop();
$('drop').onclick = () => {
  if (rec?.state === 'recording') { chunks = []; rec.onstop = null; rec.stop(); }
  if (meter) { meter.ctx.close().catch(() => {}); meter = null; }
  rec = null;
  $('recording').hidden = true;
  $('rest').hidden = false;
};

async function send(blob) {
  $('recording').hidden = true;
  setSay(X.hearing, true);
  thinking(true);
  try {
    const r = await fetch('/transcribe', {
      method: 'POST',
      headers: {'Content-Type': blob.type || 'audio/webm'},
      body: blob,
    });
    if (!r.ok) throw new Error(await r.text());
    const {text} = await r.json();
    if (!text) throw new Error('没听清');
    await submit(text);
  } catch (e) {
    $('err').textContent = X.err + String(e.message || e).slice(0, 160);
    $('err').hidden = false;
    setSay('');
  } finally {
    thinking(false);
    rec = null;
    $('rest').hidden = false;
  }
}
$('cancel').onclick = () => {
  $('compose').hidden = true;
  $('rest').hidden = false;
  $('t').value = '';
};

/** 说的和打的走同一条路：到这里都只是一段文字。 */
async function submit(text) {
  const r = await fetch('/braindump', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({braindump: text, lang: LANG}),
  });
  if (!r.ok) throw new Error(await r.text());
  render(await r.json());
}

$('send').onclick = async () => {
  const text = $('t').value.trim();
  if (!text) { $('t').focus(); return; }
  $('send').disabled = true;
  $('send').textContent = X.sending;
  $('err').hidden = true;
  thinking(true);
  try {
    await submit(text);
    $('compose').hidden = true;
    $('rest').hidden = false;
    $('t').value = '';
  } catch (e) {
    $('err').textContent = X.err + String(e.message || e).slice(0, 160);
    $('err').hidden = false;
  } finally {
    thinking(false);
    $('send').disabled = false;
    $('send').textContent = X.send;
  }
};

function render(turn) {
  setSay(turn.say || '');
  const box = $('cards');
  box.innerHTML = '';

  for (const c of turn.cards || []) {
    if (c.type === 'tasks') {
      for (const t of c.items) {
        const el = document.createElement('div');
        el.className = 'card' + (t.forHer ? ' her' : '');
        el.innerHTML = '<div class="box"></div><div><div class="lab"></div>' +
                       (t.note ? '<div class="sub"></div>' : '') + '</div>';
        // textContent 填值，不把模型输出当 HTML 解析
        el.querySelector('.lab').textContent = t.label;
        if (t.note) el.querySelector('.sub').textContent = t.note;
        box.appendChild(el);
      }
    } else if (c.type === 'later' && c.items.length) {
      const h = document.createElement('div');
      h.className = 'quiet-h'; h.textContent = X.quiet;
      const p = document.createElement('div');
      p.className = 'quiet'; p.textContent = c.items.join(' · ');
      box.append(h, p);
    }
  }
  box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
