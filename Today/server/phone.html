<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EFF3FD">
<title>Today</title>
<style>
  /*
   * 对话是最外层。
   *
   * Today 说的每一句是一个气泡；今天要做的那几件也是它说出来的，
   * 只是那条消息的内容是一张可勾选的卡片，而不是一段文字。
   * 卡片不是另一个区域，是消息的一种。
   *
   * 两个 tab 沉在页面里——没有彩色导航条。
   * 彩色导航条是工具应用的样子，这个东西是陪着你的。
   */
  /* 极光色。暖橙暖棕看一天是累的——它一直在推你；
     浅蓝浅紫是退后的。而橙色的老虎放在冷色上成了画面里唯一的暖源，
     自己就跳出来，不用给它加任何强调。
     杏色只留给「这件是给你自己的」，全系统唯一的暖色标记。 */
  :root{
    --ember:#6B5CE7; --ember-deep:#574AD1; --ember-tint:#ECE9FB;
    --warm:#E89B5B;
    --ink:#1C1A2A; --soft:#58546C; --faint:#9793A6;
    --glass:rgba(255,255,255,.82);
    --line:rgba(107,92,231,.13);
    --shadow:0 8px 26px rgba(107,92,231,.13);
  }
  /* 这一页不跟系统深色。她的手机常年深色，但 Today 不是一个夜里用的东西——
     而且电视那边已经有一天四个时段的光线了，两块屏各自变暗只会对不上。 */
  :root{color-scheme:light}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* iOS Safari 弹出键盘时 layout viewport 不变，收起后也不复位，
     于是页面底下留一块白、内容还溢出。用 visualViewport 的实际高度顶上去。 */
  html,body{margin:0;height:var(--vh,100%);overscroll-behavior:none}
  body{
    color:var(--ink);
    font:400 17px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    display:flex;flex-direction:column;
    background:
      radial-gradient(118% 54% at 82% 0%, rgba(140,127,240,.17), transparent 62%),
      radial-gradient(92% 46% at 2% 16%, rgba(99,160,235,.12), transparent 58%),
      linear-gradient(168deg,#EFF3FD 0%,#F3F1FC 50%,#F8F7FC 100%);
  }

  /* ── 顶部：两个 tab，沉在页面里，没有导航条 ── */
  nav{
    flex:0 0 auto;display:flex;gap:22px;align-items:baseline;
    padding:max(14px,env(safe-area-inset-top)) 22px 2px;
  }
  nav button{
    border:0;background:transparent;padding:2px 0 7px;cursor:pointer;
    font:600 24px/1 inherit;letter-spacing:-.01em;
    color:var(--faint);transition:color .2s;position:relative;
  }
  /* 原来两个 tab 和正文一样大、一样灰，看不出是导航。
     放大一号，选中的那个压到正文色并在底下留一道短线——
     不是一条有颜色的导航条，只是让「现在在哪一页」有个落点。 */
  nav button.on{color:var(--ink)}
  nav button.on::after{
    content:'';position:absolute;left:0;right:0;bottom:0;height:2px;
    border-radius:2px;background:var(--ember);
  }
  nav .grow{flex:1}
  nav .icon{padding:6px;display:grid;place-items:center;color:var(--faint)}
  nav .icon svg{width:21px;height:21px;fill:none;stroke:currentColor;
    stroke-width:2;stroke-linecap:round}
  nav .icon:active{color:var(--ink)}
  /* 中 / EN。她按一下，这屏和电视一起换——录 demo 要全程英文时用得上。
     做得比 tab 小一号：这是设置，不是她每天要看的东西。 */
  #lang{
    border:0;background:transparent;padding:5px 7px;cursor:pointer;
    font:600 13px/1 inherit;letter-spacing:.06em;color:var(--faint);
    border-radius:8px;transition:color .2s,background .2s;
  }
  #lang:active{color:var(--ember);background:var(--ember-tint)}

  /* 历史：从左边滑出的一层，不是另一个页面 */
  .sheet{position:fixed;inset:0;z-index:40;display:flex}
  .sheetbg{position:absolute;inset:0;background:rgba(28,26,42,.26);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .2s}
  @keyframes fade{from{opacity:0}}
  .sheetbody{
    position:relative;width:76%;max-width:320px;height:100%;
    display:flex;flex-direction:column;
    background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.7);
    backdrop-filter:blur(26px) saturate(1.7);
    border-right:1px solid var(--line);
    padding:max(18px,env(safe-area-inset-top)) 16px 20px;
    overflow-y:auto;animation:slide .26s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes slide{from{transform:translateX(-14px);opacity:.4}}
  .sheeth{margin:4px 6px 12px;font-size:11.5px;letter-spacing:.16em;
    color:var(--faint);font-weight:600}
  /* 家里人。低频变化的东西，所以是一张可以直接改的表，
     不用每次绕着对话跟它说一遍。 */
  .who{
    padding:11px 13px;border-radius:15px;margin-bottom:7px;cursor:pointer;
    background:rgba(255,255,255,.5);border:1px solid var(--line);
  }
  .who .n{font-size:15px;font-weight:500}
  .who .d{font-size:12.5px;color:var(--faint);margin-top:3px}
  .who.add{text-align:center;color:var(--ember);font-size:14px;
    background:transparent;border-style:dashed}
  .form{display:grid;gap:7px;margin:2px 0 10px}
  .pnote{font-size:12.5px;color:var(--faint);margin:2px 2px 0;line-height:1.5}
  .form input{
    width:100%;box-sizing:border-box;padding:9px 11px;font:inherit;font-size:14px;
    border:1px solid var(--line);border-radius:11px;background:var(--glass);
    color:var(--ink);outline:none;
  }
  .form input:focus{border-color:var(--ember)}
  .seg{display:flex;gap:6px}
  /* 角色是一排图，多了要能换行；比在「关系」里打字快，也不会写错 */
  .seg.roles{flex-wrap:wrap}
  .seg.roles button{flex:0 0 auto;padding:7px 11px;font-size:13.5px}
  .seg button{
    flex:1;padding:8px 0;font:inherit;font-size:13px;cursor:pointer;
    border:1px solid var(--line);border-radius:11px;background:transparent;color:var(--faint);
  }
  .seg button.on{background:var(--ember-tint);border-color:var(--ember);color:var(--ember)}
  .frow{display:flex;gap:7px}
  .frow button{
    flex:1;padding:9px 0;font:inherit;font-size:14px;font-weight:500;cursor:pointer;
    border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--ink);
  }
  .frow button.go{background:var(--ember);border-color:var(--ember);color:#fff}
  .frow button.rm{color:#C2554B;border:0}

  /* 抽屉里的一行入口。够大，一眼看得出是能点的。 */
  .entry{
    display:block;text-decoration:none;color:inherit;cursor:pointer;
    padding:13px 14px;border-radius:15px;margin-bottom:8px;
    background:rgba(255,255,255,.5);border:1px solid var(--line);
  }
  .entry:active{background:var(--ember-tint)}
  .ehead{display:flex;align-items:center;gap:8px}
  .entry .et{font-size:16px;font-weight:600;flex:1}
  .gear{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:var(--faint);
    stroke-width:1.6;stroke-linejoin:round}
  .entry:active .gear{stroke:var(--ember)}
  .entry .es{font-size:12.5px;color:var(--faint);margin-top:2px;line-height:1.45}
  /* 一行名字，带各自的小图。这不是装饰——是这块屏认得这几个人的证据。 */
  .entry .es.faces{font-size:14.5px;color:var(--soft);margin-top:5px;letter-spacing:.01em}
  /* 语言：最底下，小一号。
     标签和按钮分两行——挤在一行上，按钮只能分到一点点宽度，
     而且第一版那样做出来是透明底加一道几乎看不见的描边，
     等于把开关藏起来了。小不等于隐身。 */
  /* 钉在最底。内容少的时候它本来会飘在半空中间，看着像没放好。 */
  .langRow{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
  .langLab{display:block;font-size:12px;color:var(--faint);letter-spacing:.08em;
    text-transform:uppercase;font-weight:600;margin-bottom:8px}
  /* 两列网格，不用 flex。flex 那版容器莫名其妙按内容收缩成 34px，
     两个按钮各剩 16px 宽，字根本放不下——看着像没渲染出来。
     网格把宽度写死成一人一半，不依赖收缩行为。 */
  .seg.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
  .seg.mini button{
    width:100%;padding:9px 0;font-size:13.5px;
    background:rgba(255,255,255,.5);border-color:var(--line);color:var(--soft);
  }
  .seg.mini button.on{
    background:var(--ember-tint);border-color:var(--ember);color:var(--ember);font-weight:600;
  }

  .dayh{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);font-weight:600;margin:14px 6px 7px}
  .dayh:first-child{margin-top:0}
  .thread{
    padding:12px 14px;border-radius:15px;margin-bottom:7px;
    background:rgba(255,255,255,.5);border:1px solid var(--line);
  }
  .thread .t1{font-size:15px;font-weight:500;line-height:1.4}
  .thread .t2{font-size:12.5px;color:var(--faint);margin-top:3px}

  /* ── 形象：启动时顶部居中 ── */
  /* 打开时的 launch：形象居中 + 它先说一句 + 今天的现状。
     她一开口就收起来，把地方让给对话。 */
  .stage{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
    padding:6px 24px 0;transition:height .45s cubic-bezier(.3,.8,.3,1), opacity .35s;
    overflow:hidden;height:auto;
  }
  .stage.small{height:0;opacity:0;padding:0}
  /* 打字时只收起占地方的，留下它说的那一句——
     她正在打字，但还看得见上下文。整块收掉会剩一张空页。 */
  .stage.typing .tiger,
  .stage.typing .stat,
  .stage.typing .step,
  .stage.typing .deck{display:none}
  .stage.typing{padding-top:6px}
  .stage.typing .hi{font-size:17px;line-height:1.45;color:var(--soft);margin:0}
  .hi{font-size:21px;font-weight:400;line-height:1.45;text-align:center;
    margin:10px 0 0;max-width:19em}
  .hi.pending{color:var(--faint)}
  .stat{display:flex;gap:7px;margin:14px 0 2px;flex-wrap:wrap;justify-content:center}
  /* 今天这一步。她唯一需要看见的「进展」——不是进度条，是一句今天做什么。
     大事拆完剩下的几步我自己收着，这儿永远只有一行。 */
  .step{
    display:none;margin:15px 0 0;padding:12px 14px;border-radius:14px;
    background:var(--ember-tint);max-width:21em;text-align:left;
  }
  .step.on{display:block}
  .step .sl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ember);font-weight:600}
  .step .st{font-size:15px;line-height:1.5;margin-top:4px}
  .step .sn{font-size:12.5px;color:var(--faint);margin-top:3px}
  .step.her{background:color-mix(in srgb,var(--warm) 15%,transparent)}
  .step.her .sl{color:var(--warm)}
  /* 卡牌：中间那张是活的，两边露一点。横向可滑。 */
  .deck{
    display:flex;gap:11px;margin:16px -20px 2px;padding:4px 20px 10px;
    overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .deck::-webkit-scrollbar{display:none}
  .mode{
    flex:0 0 auto;width:138px;scroll-snap-align:center;
    border:1px solid var(--line);border-radius:20px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
    box-shadow:var(--shadow);
    padding:15px 14px 13px;text-align:left;cursor:pointer;
    transition:transform .14s, box-shadow .2s;
  }
  .mode:active{transform:scale(.97)}
  .mode .ico{font-size:21px;line-height:1;margin-bottom:9px}
  .mode .t{font-size:15.5px;font-weight:500;line-height:1.35}
  .mode .s{font-size:10.5px;letter-spacing:.14em;color:var(--faint);
    margin-top:7px;text-transform:uppercase}
  /* 主模式：理今天。它是默认，所以用主色实底 */
  .mode.key{
    background:linear-gradient(150deg,var(--ember),var(--ember-deep));
    border-color:transparent;color:#fff;
    box-shadow:0 8px 22px rgba(107,92,231,.3);
  }
  .mode.key .s{color:rgba(255,255,255,.62)}

  .stat span{
    font-size:13px;color:var(--soft);background:var(--glass);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  }
  .tiger{
    width:150px;height:auto;
    filter:drop-shadow(0 12px 24px rgba(107,92,231,.22));
    transition:opacity .3s, transform .3s;
  }
  .tiger.thinking{opacity:.55;transform:translateY(2px) scale(.98)}

  /* ── 对话流 ── */
  main{flex:1;overflow-y:auto;padding:6px 18px 10px;-webkit-overflow-scrolling:touch}
  .turn{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px;
    animation:rise .34s cubic-bezier(.2,.7,.3,1) backwards}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}}
  .turn.her{justify-content:flex-end}
  .mini{
    width:34px;height:34px;flex:0 0 auto;border-radius:50%;
    /* 半身图的头在最上面，头像窗口要贴顶才裁到脸 */
    object-fit:cover;object-position:50% 2%;
    background:var(--ember-tint);margin-bottom:2px;
    opacity:0;transition:opacity .2s;
  }
  .turn.lead .mini{opacity:1}

  .bub{
    max-width:80%;padding:13px 17px;border-radius:21px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(20px) saturate(1.6);
    backdrop-filter:blur(20px) saturate(1.6);
    border:1px solid var(--line);box-shadow:var(--shadow);
    font-size:16.5px;line-height:1.52;
  }
  .turn.today .bub{border-bottom-left-radius:8px}
  .turn.her .bub{
    border-bottom-right-radius:8px;
    background:linear-gradient(145deg,var(--ember),var(--ember-deep));
    color:#fff;border-color:transparent;
    box-shadow:0 8px 22px rgba(107,92,231,.28);
  }
  .bub.pending{color:var(--faint)}

  /* 任务卡：也是 Today 说出来的一条消息，只是内容是可勾选的卡片 */
  .bub.card{max-width:88%;padding:14px 14px 10px}
  /* 状态提示：think/work 那种。不是一句话，所以不给气泡、不给头像。 */
  .note{
    font-size:13px;color:var(--faint);line-height:1.5;
    padding:1px 4px 1px 48px;margin:-4px 0 10px;
  }
  .note b{font-weight:500;color:var(--soft)}
  .item{
    display:flex;gap:12px;align-items:flex-start;
    padding:11px 12px;border-radius:15px;margin-bottom:6px;
    background:rgba(255,255,255,.52);border:1px solid var(--line);
    position:relative;overflow:hidden;transition:background .18s;
  }
  .item:active{background:var(--ember-tint)}
  /* 冷色系里唯一的暖色标记：这件是给你自己的 */
  .item.her::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--warm)}
  .tick{
    flex:0 0 auto;width:21px;height:21px;border:2px solid var(--line);
    border-radius:7px;margin-top:2px;display:grid;place-items:center;
    transition:background .18s,border-color .18s;
  }
  .item.done .tick{background:var(--ember);border-color:var(--ember)}
  .tick svg{width:12px;height:12px;stroke:#fff;stroke-width:3.2;fill:none;
    opacity:0;transition:opacity .18s}
  .item.done .tick svg{opacity:1}
  .lab{font-size:16px;font-weight:500}
  .item.done .lab{color:var(--faint);text-decoration:line-through}
  .sub{font-size:13px;color:var(--faint);margin-top:2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 2px}
  /* 详情：从底下升起来的一层。
     电视上是按右键铺开，手机上是往上一推——同一份内容，各自的手势。 */
  .dsheet{position:fixed;inset:0;z-index:45;display:none}
  .dsheet.on{display:block}
  .dbg{position:absolute;inset:0;background:rgba(28,26,42,.3);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .2s}
  .dbody{
    position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;
    background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.7);
    backdrop-filter:blur(26px) saturate(1.7);
    border-radius:26px 26px 0 0;border-top:1px solid var(--line);
    padding:20px 20px calc(26px + env(safe-area-inset-bottom));
    animation:up .26s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes up{from{transform:translateY(18px);opacity:.5}}
  .dgrab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 14px}
  .dtitle{font-size:21px;font-weight:500;line-height:1.3;letter-spacing:-.01em}
  .dtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .dtag{font-size:12px;border:1px solid var(--line);color:var(--faint);
    border-radius:999px;padding:3px 10px}
  .dtag.hers{color:var(--warm);border-color:var(--warm)}
  .dnow{margin-top:16px;padding-left:12px;border-left:3px solid var(--ember);border-radius:1px}
  .dnow.hers{border-left-color:var(--warm)}
  .dhead{font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ember);font-weight:600}
  .dnow.hers .dhead{color:var(--warm)}
  .dnowt{font-size:16px;line-height:1.5;margin-top:3px}
  .dmeta{font-size:12.5px;color:var(--faint);margin-top:2px}
  .dsec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);font-weight:600;margin:18px 0 7px}
  .dopt{margin-bottom:13px}
  .doptn{font-size:15.5px;font-weight:600}
  .dfacts{display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:3px}
  .dfact{font-size:13.5px;line-height:1.5}
  .dfact b{color:var(--faint);font-weight:400;margin-right:5px}
  .dstep{font-size:14.5px;line-height:1.6;color:var(--soft)}
  .dstep.done{text-decoration:line-through;color:var(--faint)}

  .chip{font-size:13px;color:var(--soft);background:rgba(255,255,255,.5);
    border:1px solid var(--line);border-radius:999px;padding:5px 11px}
  /* 有东西可看的才可点。没有的就是一行字，不要许一个空的承诺。 */
  .chip.can{cursor:pointer;color:var(--ember);border-color:var(--ember)}
  .chip.can:active{background:var(--ember-tint)}

  /* ── todo 面 ── */
  .pane{padding:4px 4px 10px}
  .ph{margin:16px 4px 9px;font-size:11.5px;letter-spacing:.16em;color:var(--faint);font-weight:600}
  .ph:first-child{margin-top:4px}
  .flat{
    background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    border:1px solid var(--line);border-radius:19px;padding:6px;box-shadow:var(--shadow);
  }
  .empty{color:var(--faint);font-size:15px;padding:12px 6px}
  .fact{display:flex;gap:10px;align-items:baseline;padding:10px 12px}
  .fact + .fact{border-top:1px solid var(--line)}
  .ft{flex:1;font-size:15.5px;line-height:1.45}
  .fa{flex:0 0 auto;font-size:12px;color:var(--faint)}
  /* 旧到该先确认一句的那些：整行淡下去，时间那列说明原因 */
  .fact.stale .ft{color:var(--faint)}
  .fact.stale .fa{color:var(--ember)}

  /* ── 底部输入条 ── */
  footer{flex:0 0 auto;padding:6px 16px max(13px,env(safe-area-inset-bottom))}
  .bar{
    display:flex;align-items:center;gap:9px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(24px) saturate(1.7);backdrop-filter:blur(24px) saturate(1.7);
    border:1px solid var(--line);border-radius:999px;
    padding:6px 6px 6px 19px;box-shadow:var(--shadow);
  }

<script>
const $ = id => document.getElementById(id);

/* 键盘弹出/收起时把真实可视高度写进 --vh，页面跟着它走 */
const vv = window.visualViewport;
const syncVH = () => {

};
syncVH();
vv?.addEventListener('resize', syncVH);

vv?.addEventListener('scroll', syncVH);
window.addEventListener('orientationchange', () => setTimeout(syncVH, 250));
const DICT = {
  zh: {today:'今天', todo:'待办', ph:'说点什么，或者按右边说话', drop:'算了',
       hearing:'我在听…', taking:'我记一下…', lead:'我帮你记着今天这些事',

       placeSave:'存下', placeNone:'还没设。设了之后电视上会有今天的天气。',
       placeBad:'没找到这个地方，换个写法试试',
       dStep:'今天这一步', dGuide:'我替你查到的', dSteps:'这件事是这么拆的',
       dDone:'已经做掉的', dAsked:'我问过你，还没答', dHers:'这是你自己的事',
       dWaited:n=>`搁了 ${n} 天`, dChecked:'查过了，出门前再确认一次时间和价格',
       updated:'更新了', history:'聊过的', noHistory:'还没有别的对话',
       today:'今天', yday:'昨天', daysAgo:d=>`${d} 天前`, stale:'要确认一下',
       cAdd:n=>`记上 ${n}`, cDone:n=>`${n} 做完了`,
       cMoved:n=>`${n} 挪到以后`, cKept:n=>`收着 ${n}`,
       statLeft:n=>`今天还剩 ${n} 件`, statDone:'今天的事都做完了',
       statNone:'今天还没有事', statKept:n=>`先收着 ${n} 件`, statMem:n=>`记着 ${n} 条`,
       modes:[
         {k:'note',  ico:'🏷️', t:'先帮我记着',  s:'NOTE',  ph:'一句话，什么都行',
          open:'说吧，我记着，不用你整理。'},
         {k:'',      ico:'🌤️', t:'帮我理今天',  s:'TODAY', ph:'想到什么说什么，不用整理', key:true,
          open:'今天手上有什么？想到哪说到哪就行。'},
         {k:'write', ico:'✍️', t:'替我写句话',  s:'WRITE', ph:'要发给谁，说什么意思',
          open:'发给谁，你想让对方知道什么？'},
       ],

       tooShort:'太短了，没听清。',
       maxLen:'录到一分钟，先停下了。',
       none:'今天还没有事。'},
  en: {today:'Today', todo:'Todo', ph:'Type, or hold the mic', drop:'Never mind',
       hearing:'Listening…', taking:'Taking that in…', lead:"I'm keeping these for you today",
       quiet:"I'm holding these", remember:'I also remember', err:"Didn't work: ",
       updated:'updated', history:'Conversations', noHistory:'No other conversations',
       today:'today', yday:'yesterday', daysAgo:d=>`${d}d ago`, stale:'worth checking',
       cAdd:n=>`added ${n}`, cDone:n=>`${n} done`,
       cMoved:n=>`moved ${n} off today`, cKept:n=>`holding ${n}`,
       statLeft:n=>`${n} left today`, statDone:'All done today',
       statNone:'Nothing yet today', statKept:n=>`${n} held`, statMem:n=>`${n} remembered`,
       modes:[
         {k:'note',  ico:'🏷️', t:'Just hold this', s:'NOTE',  ph:'One line, anything',
          open:"Go on — I'll keep it. You don't have to tidy it up."},
         {k:'',      ico:'🌤️', t:'Sort out today', s:'TODAY', ph:'Say it however it comes', key:true,
          open:"What's on today? However it comes out is fine."},
         {k:'write', ico:'✍️', t:'Write it for me', s:'WRITE', ph:'Who it goes to, what you mean',
          open:'Who is it going to, and what do you want them to know?'},
       ],
       copy:'Copy', copied:'Copied',
       fallback:"I'm here.",
       stepLabel:"Today's one step, I'm moving it", stepHer:"Today's one step — this one is yours",
       family:'Family', addPerson:'＋ Add someone', save:'Save', del:'Remove',
       fName:'Name', fEn:'Name in English', fRel:'Who they are: son / daughter / husband / my mum…',
       fBorn:'Born — month is enough: 2023-04', fAge:'Only know their age? Just the number',
       fNote:'One thing that stays true: nursery class, peanut allergy',
       theyHe:'he', theyShe:'she', theyNone:'rather not say', fBlank:'nothing filled in yet',
       langHead:'Language', placeHead:'Where you are',
       myT:'My', myS:'Your family, where you are, what I\'m holding',
       tvT:'Big screen', tvS:"The television side, in a browser",
       myFam:'Family', myPlace:'Where you are', myHold:"What I keep",
       myEdit:'Change something', myDone:'Done', myNone:'Not set yet', placePh:'A town is enough — e.g. Leeds',
       placeSave:'Save', placeNone:"Not set. Set it and the television shows today's weather.",
       placeBad:"Couldn't find that — try another spelling",
       dStep:"Today's step", dGuide:'What I found for you', dSteps:'How this breaks down',
       dDone:'Already done', dAsked:"I asked you this, and you haven't said", dHers:'This one is yours',
       dWaited:n=>`Waiting ${n} days`, dChecked:'Looked up — check times and prices again before you set out',
       noMic:"This browser can't record. Type instead.",
       insecure:'Open the https address to use the mic. This one is http, so the browser blocks it.',
       denied:'Microphone is blocked. Allow this site to use it in your browser settings.',
       noDevice:'No microphone found.',
       tooShort:"That was too short to hear.",
       maxLen:'Stopped at one minute.',
       none:'Nothing yet today.'},
};
/* UI 语言默认跟设备，但如果当天的对话已经是中文，就跟着对话走——
   卡片引导语是英文、里面的事情是中文，看着是两个人在说话。
   她在顶上按过那个按钮之后，这套自动的就全让位——她说了算。 */
let LANG = (navigator.language||'en').toLowerCase().startsWith('zh') ? 'zh' : 'en';
let X = DICT[LANG];
let chosen = false;              // 她自己挑过没有

/** 把当前语言刷到屏幕上。只管画，不管决定画哪个。 */
function paintLang() {
  X = DICT[LANG];
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  $('tabToday').textContent = X.today;
  $('tabTodo').textContent = X.todo;
  $('t').placeholder = X.ph;
  $('drop').textContent = X.drop;
}

const relang = (extra = '') => {
  if (chosen) return;            // 她挑过了，别再替她改
  const text = (day.messages ?? []).map(m => m.text || '').join('') + extra;
  const next = /[\u4e00-\u9fa5]/.test(text) ? 'zh' : LANG;
  if (next === LANG) return;
  LANG = next;
  paintLang();
};
paintLang();

/* 换语言。不是只换这块屏上的字——电视那边也跟着变，
   所以要先告诉服务端，再让 Today 用新语言重新说一句开场。
   从顶栏挪进抽屉了：顶上东西太多，而这是一年按不了几次的设置。 */
async function setLang(next) {
  if (next === LANG) return;
  LANG = next;
  chosen = true;
  paintLang();
  drawLang();
  if (!$('stage').classList.contains('small')) { drawDeck(); drawStat(); }
  try {
    await fetch('/prefs', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({lang: LANG}),
    });
  } catch {}
  // 开场白是上一个语言生成的，留着就是半中半英
  if (!$('stage').classList.contains('small')) {
    $('hi').classList.add('pending');
    $('hi').textContent = '';
    await openLaunch();
  }
}

function drawLang() {
  $('langh').textContent = X.langHead;
  const box = $('langSeg');
  box.innerHTML = '';
  for (const [v, label] of [['zh', '中文'], ['en', 'English']]) {
    const b = document.createElement('button');
    b.textContent = label;
    b.classList.toggle('on', LANG === v);
    b.onclick = () => setLang(v);
    box.appendChild(b);
  }
}

let day = {messages: [], memory: null};
let tab = 'today';
const thinking = on => $('tiger').classList.toggle('thinking', on);
const showErr = m => { $('err').textContent = X.err + String(m).slice(0,150); $('err').hidden = false; };
const el = (cls, tag='div') => { const e=document.createElement(tag); e.className=cls; return e; };

/* 开场：形象在顶部居中，Today 先说一句只有它能说的话。
   她一旦开口，形象收起来——舞台让给对话。 */
(async () => {
  // 她上次挑的语言存在服务端，不在这台手机上——
  // 换个浏览器打开、或者电视先开着，看到的都是同一种语言。
  try {
    const {lang} = await (await fetch('/prefs')).json();
    if (lang === 'zh' || lang === 'en') { LANG = lang; chosen = true; paintLang(); }
  } catch {}
  try { day = await (await fetch('/day')).json(); } catch {}
  await syncProjects();
  draw();
  await openLaunch();
})();

/** launch：形象 + 它先说一句 + 今天的现状。不在对话流里，是一屏问候。 */
async function openLaunch() {
  relang();
  let step = null;
  try {
    const g = await (await fetch(`/greet?lang=${LANG}`)).json();
    $('hi').textContent = g.say || X.fallback;
    step = g.step;
  } catch { $('hi').textContent = X.fallback; }
  $('hi').classList.remove('pending');
  // 招呼可能是中文而设备是英文——拿到之后再判一次语言
  relang($('hi').textContent);
  // 这一步的小标题得等语言定下来再画，不然中文页面上会顶着一行英文
  drawStep(step);
  drawStat();
}

/** 今天这一步。没有就整块不出现——宁可空着，不要放一句占位的废话。 */
function drawStep(step) {
  const box = $('step');
  box.className = 'step';
  if (!step?.text) return;
  box.innerHTML = '';
  const l = el('sl'); l.textContent = step.forHer ? X.stepHer : X.stepLabel;
  const t = el('st'); t.textContent = step.text;
  box.append(l, t);
  if (step.note) { const n = el('sn'); n.textContent = step.note; box.append(n); }
  box.classList.add('on');
  if (step.forHer) box.classList.add('her');
}

function drawStat() {
  const tasks = cardOf('tasks');
  const later = cardOf('later');
  const left = (tasks?.items ?? []).filter(i => !i.done).length;
  const bits = [];
  if (!tasks?.items.length) bits.push(X.statNone);
  else bits.push(left === 0 ? X.statDone : X.statLeft(left));
  if (later?.items.length) bits.push(X.statKept(later.items.length));
  if (day.memory?.items?.length) bits.push(X.statMem(day.memory.items.length));
  $('stat').innerHTML = '';
  for (const b of bits) {
    const e = document.createElement('span'); e.textContent = b; $('stat').appendChild(e);
  }
  drawDeck();
}

/** 当前模式。空 = 理今天。她直接打字也是空。 */
let mode = '';

function drawDeck() {
  const d = $('deck');
  d.innerHTML = '';
  for (const m of X.modes) {
    const c = el('mode' + (m.key ? ' key' : ''));
    const i = el('ico'); i.textContent = m.ico;
    const t = el('t'); t.textContent = m.t;
    const s2 = el('s'); s2.textContent = m.s;
    c.append(i, t, s2);
    c.onclick = () => pick(m);
    d.appendChild(c);
  }
  // 默认那张居中
  requestAnimationFrame(() => {
    const key = d.querySelector('.mode.key');
    if (key) d.scrollLeft = key.offsetLeft - (d.clientWidth - key.clientWidth) / 2;
  });
}

/**
 * 挑了一种模式。
 *
 * 原来是点完变成「选中」，然后她自己接着写——那是个表单控件，不是 agent。
 * 她说得对：**应该是 Today 引导她**。
 *
 * 所以点一下，Today 当场开口问那一句——「发给谁，你想让对方知道什么？」——
 * 她接着答就行。对话由它起头，不是她。
 *
 * 这一句是写死的，不是生成的：点一下要立刻有反应，等三秒再出现就不叫引导了。
 * 而且这三句每次都成立——它们本来就是那件事的第一个问题。
 */
function pick(m) {
  mode = m.k;
  $('t').placeholder = m.ph;
  if (m.open) {
    day = {...day, messages: [...(day.messages ?? []), {
      who: 'today', text: m.open, at: new Date().toISOString(), local: true,
    }]};
    typing = true;      // 舞台让开，她要答话了
    draw();
  }
  $('t').focus();
}

/** 把一轮改动说成人话。界面上只有一行字的位置，所以每类最多说两件。 */
function changeWords(ch) {
  if (!ch) return [];
  const two = a => (a ?? []).slice(0, 2).join('、');
  const out = [];
  if (ch.done?.length) out.push(X.cDone(two(ch.done)));
  if (ch.added?.length) out.push(X.cAdd(two(ch.added)));
  if (ch.moved?.length) out.push(X.cMoved(two(ch.moved)));
  if (ch.kept?.length) out.push(X.cKept(two(ch.kept)));
  return out;
}

/** 当天最后一张某类卡。 */
const cardOf = type => [...(day.messages ?? [])].reverse()
  .flatMap(m => m.cards ?? []).find(c => c.type === type);

function setTab(next) {
  tab = next;
  $('tabToday').classList.toggle('on', next === 'today');
  $('tabTodo').classList.toggle('on', next === 'todo');
  $('foot').hidden = next !== 'today';
  draw();
}
$('tabToday').onclick = () => setTab('today');
$('tabTodo').onclick = () => setTab('todo');

/** 开一段新的。卡片不动——今天要做的事不随对话段落重置。 */
$('fresh').onclick = async () => {
  try { day = await (await fetch('/new', {method:'POST'})).json(); } catch { return; }
  tab = 'today';
  $('tabToday').classList.add('on');
  $('tabTodo').classList.remove('on');
  $('foot').hidden = false;
  $('scroll').innerHTML = '';
  // settle() 会按「她开过口没有」决定收不收起 launch，
  // 新开一段时 messages 已清空，所以它自己会展开——先画再问候。
  draw();
  await openLaunch();
};

/* ── 按进去的那一层 ────────────────────────────────────
   和电视上是同一份内容：今天这一步、查回来的那张表、拆解。
   电视按右键铺开，手机往上一推——手势不同，东西是同一个。 */

let projCache = [];
const tidy = v => String(v||'').replace(/[\s·,.，。、:：]/g,'').toLowerCase();
const projFor = label => {
  const a = tidy(label);
  return projCache.find(q => tidy(q.title) === a)
      ?? projCache.find(q => tidy(q.title).includes(a) || a.includes(tidy(q.title)))
      ?? null;
};
const hasDepth = p => !!(p && (p.steps?.length || p.asked || p.guide?.options?.length));

async function syncProjects() {
  try { projCache = (await (await fetch('/projects')).json()).items ?? []; }
  catch { projCache = []; }
}

function openDetail(p) {
  if (!p) return;
  const box = $('dcontent');
  box.innerHTML = '';
  const add = (cls, text, tag='div') => {
    const e = el(cls, tag); if (text != null) e.textContent = text; box.appendChild(e); return e;
  };
  add('dtitle', p.title);

  const tags = el('dtags');
  if (p.forHer) { const t = el('dtag hers','span'); t.textContent = X.dHers; tags.appendChild(t); }
  if (p.waited > 0) { const t = el('dtag','span'); t.textContent = X.dWaited(p.waited); tags.appendChild(t); }
  if (tags.children.length) box.appendChild(tags);

  const next = (p.steps ?? []).find(s => !s.done);
  if (next) {
    const n = el('dnow' + (p.forHer ? ' hers' : ''));
    const h = el('dhead'); h.textContent = X.dStep;
    const t = el('dnowt'); t.textContent = next.text;
    n.append(h, t);
    if (next.note) { const m = el('dmeta'); m.textContent = next.note; n.appendChild(m); }
    box.appendChild(n);
  } else if (p.asked) {
    const n = el('dnow' + (p.forHer ? ' hers' : ''));
    const h = el('dhead'); h.textContent = X.dAsked;
    const t = el('dnowt'); t.textContent = p.asked;
    n.append(h, t); box.appendChild(n);
  }

  if (p.guide?.options?.length) {
    add('dsec', X.dGuide);
    for (const o of p.guide.options.slice(0, 5)) {
      const w = el('dopt');
      const n = el('doptn'); n.textContent = o.name; w.appendChild(n);
      const f = el('dfacts');
      for (const x of (o.facts ?? []).slice(0, 5)) {
        const e = el('dfact');
        const b = document.createElement('b'); b.textContent = x.k;
        e.append(b, document.createTextNode(x.v)); f.appendChild(e);
      }
      w.appendChild(f);
      if (o.note) { const nt = el('dmeta'); nt.textContent = o.note; w.appendChild(nt); }
      if (o.source) { const sc = el('dmeta'); sc.textContent = o.source; w.appendChild(sc); }
      box.appendChild(w);
    }
    add('dmeta', X.dChecked);
  }

  const rest = (p.steps ?? []).filter(s => !s.done && s !== next);
  if (rest.length) {
    add('dsec', X.dSteps);
    for (const s2 of rest) add('dstep', '·  ' + s2.text);
  }
  const done = (p.steps ?? []).filter(s => s.done);
  if (done.length) {
    add('dsec', X.dDone);
    for (const s2 of done) add('dstep done', '✓  ' + s2.text);
  }
  $('dsheet').classList.add('on');
}
const closeDetail = () => $('dsheet').classList.remove('on');
$('dbg').onclick = closeDetail;
addEventListener('keydown', e => e.key === 'Escape' && closeDetail());

/* ── My ────────────────────────────────────────────────
   先给她看现在是什么样，想改再改。
   一打开就是一堆输入框，那是在让她填表——而这个产品的整条线
   都是「你说，我记」，不是「你填」。 */

let myEditing = false;

async function openMy() {
  const box = $('mycontent');
  box.innerHTML = '';
  const add = (cls, text, tag='div') => {

  };
  add('dtitle', X.myT);

  let place = null, wx = null;
  try { const r = await (await fetch('/place')).json(); place = r.place; wx = r.weather; } catch {}

  if (myEditing) {
    // 改的时候才出现表单
    add('dsec', X.myFam);

    famBox = fam; drawFamily();
    add('dsec', X.myPlace);
    const pf = el('form');

    const save = document.createElement('button');
    save.className = 'go'; save.textContent = X.placeSave;
    save.onclick = async () => {
      try {
        await fetch('/place', {method:'POST', headers:{'Content-Type':'application/json'},

      } catch {}
      openMy();
    };

    pf.append(pi, row); box.appendChild(pf);
  } else {
    // 预览：读起来像一段话，不像一张表

    for (const p of people) {

    }

    add('dsec', X.myPlace);
    add('dmeta', wx
      ? `${place.name} · ${Math.round(wx.low)}°–${Math.round(wx.high)}°`
      : (place?.name ?? X.myNone));

    // 它一直替她记着的那几条。这是「现在的情况」里最该先看见的。
    try {
      const mem = await (await fetch('/memory')).json();
      const keep = (mem?.facts?.['要紧的叮嘱'] ?? []).map(f => f.text);

/* ── 家里人 ──────────────────────────────────────────────
   孩子不天天改名，大人不天天生孩子——这类东西该是一张表，
   不是每次都要在对话里重说一遍。
   年龄这一栏是算出来的：存生日，不存岁数，所以它明年自己会变。 */

let famEditing = null;      // 正在改谁的 id；'new' = 在加人
let famRoles = [];          // 角色表，服务端给

async function loadFamily() {
  try {
    const r = await (await fetch(`/people?lang=${LANG}`)).json();
    famRoles = r.roles ?? famRoles;
    return r.people ?? [];
  } catch { return []; }
}

let famBox = null;   // My 面板打开时指到它里面那块

async function drawFamily() {
  const box = famBox;
  if (!box) return;
  box.innerHTML = '';
  const list = await loadFamily();

  for (const p of list) {
    if (famEditing === p.id) { box.appendChild(personForm(p)); continue; }
    const row = el('who');
    const n = el('n');
    n.textContent = `${p.icon ?? ''} ${p.en ? `${p.name} · ${p.en}` : p.name}`.trim();
    const bits = [p.rel, p.age, p.they].filter(Boolean);
    const d = el('d'); d.textContent = bits.join(' · ') || X.fBlank;
    row.append(n, d);
    row.onclick = () => { famEditing = p.id; drawFamily(); };
    box.appendChild(row);
  }

  if (famEditing === 'new') box.appendChild(personForm({}));
  else {
    const add = el('who add');
    add.textContent = X.addPerson;
    add.onclick = () => { famEditing = 'new'; drawFamily(); };
    box.appendChild(add);
  }
}

/** 一个人的表单。她给什么存什么，不逼她填完。 */
function personForm(p) {
  const f = el('form');
  const field = (key, ph, val) => {
    const i = document.createElement('input');
    i.placeholder = ph; i.value = val ?? ''; i.dataset.k = key;
    return i;
  };
  // 生日这一栏只回填她真填过的。approx 的那个年份是从「三岁」倒推出来的，
  // 显示在这儿她一按存下就变成了确定的生日——猜的东西不能让她替它背书。
  // 先选是谁。一排图，点一下就行——比让她在「关系」里打字快得多，
  // 而且可以重复：两个妈妈、两个爸爸都正常。
  let role = p.role ?? '';
  const roles = el('seg roles');
  for (const r of famRoles) {
    const b = document.createElement('button');
    b.innerHTML = '';
    b.textContent = `${r.icon} ${r.label}`;
    b.classList.toggle('on', role === r.key);
    b.onclick = () => {
      role = r.key;
      for (const x of roles.children) x.classList.remove('on');
      b.classList.add('on');
    };
    roles.appendChild(b);
  }
  f.appendChild(roles);

  const exact = p.born && !p.approx ? p.born : '';
  const inputs = [
    field('name', X.fName, p.name),
    field('en', X.fEn, p.en),
    field('rel', X.fRel, p.rel),
    field('born', X.fBorn, exact),
  ];
  // 没有确切生日时才问岁数，并且把算出来的岁数填回去给她看
  if (!exact) inputs.push(field('age', X.fAge, p.ageNum ?? ''));
  f.append(...inputs);

  // 怎么称呼。不选就是不选——留空我用 they，不替她猜。
  let they = p.they ?? '';
  const seg = el('seg');
  for (const [v, label] of [['he', X.theyHe], ['she', X.theyShe], ['', X.theyNone]]) {
    const b = document.createElement('button');
    b.textContent = label;
    b.classList.toggle('on', they === v);
    b.onclick = () => {
      they = v;
      for (const x of seg.children) x.classList.remove('on');
      b.classList.add('on');
    };
    seg.appendChild(b);
  }
  f.appendChild(seg);
  f.appendChild(field('note', X.fNote, p.note));

  const row = el('frow');
  const save = document.createElement('button');
  save.className = 'go'; save.textContent = X.save;
  save.onclick = async () => {
    const op = {op: 'set', they: they || undefined, role: role || undefined};
    if (p.id) op.id = p.id;
    for (const i of f.querySelectorAll('input')) {
      const v = i.value.trim();
      if (v) op[i.dataset.k] = i.dataset.k === 'age' ? Number(v) : v;
    }
    if (!op.name) return;                 // 没名字不是一个人
    await fetch('/people', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ops: [op], lang: LANG}),
    }).catch(() => {});
    famEditing = null;
    drawFamily();
  };
  const cancel = document.createElement('button');
  cancel.textContent = X.drop;
  cancel.onclick = () => { famEditing = null; drawFamily(); };
  row.append(cancel, save);

  if (p.id) {
    const rm = document.createElement('button');
    rm.className = 'rm'; rm.textContent = X.del;
    rm.onclick = async () => {
      await fetch('/people', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ops: [{op: 'drop', id: p.id}]}),
      }).catch(() => {});
      famEditing = null;
      drawFamily();
    };
    row.appendChild(rm);
  }
  f.appendChild(row);
  return f;
}

$('menu').onclick = async () => {

/** 哪天说的。今天、昨天，再往前就说星期几——日期数字她不会去算。 */
function dayWord(k) {
  const d = new Date(k + 'T12:00:00');
  const t = new Date(); t.setHours(12, 0, 0, 0);
  const diff = Math.round((t - d) / 86400000);
  if (diff <= 0) return X.today;
  if (diff === 1) return X.yday;
  if (diff < 7) return d.toLocaleDateString(LANG === 'zh' ? 'zh-CN' : 'en-US', {weekday: 'long'});
  return d.toLocaleDateString(LANG === 'zh' ? 'zh-CN' : 'en-US', {month: 'short', day: 'numeric'});
}

const closeSheet = () => { $('sheet').hidden = true; };
$('sheetbg').onclick = closeSheet;

/**
 * 她一开口，launch 收起，把地方让给对话。
 *
 * 「开口」也包括**手按在输入框上**。键盘一弹，可视高度只剩四成，
 * 而 launch 那一块（老虎 + 问候 + 今天这一步 + 卡牌）塞不下，
 * 就从顶上被切掉——她截图里老虎只剩半只，就是这个。
 *
 * 调高度治不了，那是内容比容器高。正确的做法是这时候本来就不需要老虎：
 * 她在打字，舞台让给她。
 */
let typing = false;
const settle = () => {
  const st = $('stage');
  const gone = tab === 'todo' || (day.messages ?? []).some(m => m.who === 'her');
  st.classList.toggle('small', gone);
  // 还没开口、只是把手放在输入框上：收掉老虎和卡片，那一句留着。
  st.classList.toggle('typing', !gone && typing);
};

function draw() {
  relang();
  settle();
  if (!$('stage').classList.contains('small')) drawStat();
  const box = $('scroll');
  box.innerHTML = '';
  tab === 'today' ? drawChat(box) : drawTodo(box);
  box.scrollTop = box.scrollHeight;
}

function drawChat(box) {
  let prev = null;
  // 每一轮都带一张完整的卡，但只有最新那张是活的。
  // 全部渲染出来就成了同一张卡的一摞副本，往下滚全是重复。
  // 旧的收成一行「我更新了一下」——事情发生过，但不占地方。
  const live = (day.messages ?? []).reduce(
    (acc, m, i) => ((m.cards ?? []).some(c => c.type === 'tasks' || c.type === 'later') ? i : acc), -1);
  for (const [idx, m] of (day.messages ?? []).entries()) {
    const t = el(`turn ${m.who}` + (m.who !== prev ? ' lead' : ''));
    if (m.who === 'today') {
      const av = document.createElement('img');
      av.className = 'mini'; av.src = '/today-tiger.png'; av.alt = '';
      t.appendChild(av);
    }
    const hasCard = (m.cards ?? []).some(c => c.type === 'tasks' || c.type === 'later');
    const isLive = idx === live;
    const tasks = isLive ? (m.cards ?? []).find(c => c.type === 'tasks') : null;
    const later = isLive ? (m.cards ?? []).find(c => c.type === 'later') : null;
    // 草稿不参与「只留最新一张」那条规则——
    // 那条是为任务卡做的（每轮都重复整张卡），而每段草稿都是独立内容，
    // 折叠掉就等于她写过的东西不见了。
    const draft = (m.cards ?? []).find(c => c.type === 'draft');
    if (m.text) t.appendChild(bub(m.text, m.who));
    box.appendChild(t);
    if (hasCard && !isLive) {
      const n = el('note');
      n.innerHTML = '';
      const parts = changeWords(m.changed);
      if (parts.length) {
        for (const [i, p] of parts.entries()) {
          if (i) n.appendChild(document.createTextNode(' · '));
          const b = document.createElement('b'); b.textContent = p;
          n.appendChild(b);
        }
      } else n.textContent = X.updated;
      box.appendChild(n);
    }
    // 草稿单独一条消息，紧跟在它说的那句话后面
    if (draft) {
      const c = el('turn today');
      c.appendChild(el('mini','img'));
      const b = el('bub card');
      const d = el('draft'); d.textContent = draft.text;
      const btn = el('copy', 'button'); btn.textContent = X.copy;
      btn.onclick = async () => {
        try { await navigator.clipboard.writeText(draft.text); btn.textContent = X.copied; }
        catch { /* 没有剪贴板权限就算了，文字本身可以长按选 */ }
      };
      b.append(d, btn);
      c.appendChild(b);
      box.appendChild(c);
    }
    // 任务卡单独一条消息——它也是 Today 说出来的
    if (tasks || later) {
      const c = el('turn today');
      c.appendChild(el('mini','img'));
      const b = el('bub card');
      // 卡片不自报家门——每次都挂一句「我帮你记着这些事」会僵。
      // 它是什么，看一眼就知道。
      if (tasks) for (const i of tasks.items) b.appendChild(item(i));
      if (later?.items.length) {
        const ch = el('chips');
        // 模型给的「以后」不一定把在推的事都写上，但有指南的那件事必须够得着——
        // 查回来的东西点不开，等于没查。所以缺的补进来，有内容的排前面。
        //
        // 去重要宽：模型每轮措辞都不一样（「Add Coco to the health plan」和
        // 「Insurance for Coco」、「See the dentist」和「Her own dentist」），
        // 精确匹配一个都拦不住，卡片上就并排站着三组同义的。
        // 已经在今天任务里的也别再出现一次。
        // 子串匹配不够：「Sign Stelle's conference form」和
        // 「Sign and return Stelle's conference form」中间插了两个词，
        // 谁也不包含谁，于是并排站着。按词重合算——短的那组里
        // 七成以上的词出现在另一组，就是同一件事。
        const words = t => String(t || '').toLowerCase()
          .split(/[^a-z\u4e00-\u9fa5]+/).filter(w => w.length > 2);
        const same = (a, b) => {
          const A = words(a), B = words(b);
          if (!A.length || !B.length) return false;
          const [s1, s2] = A.length <= B.length ? [A, B] : [B, A];
          const hit = s1.filter(w => s2.includes(w)).length;
          return hit / s1.length >= 0.7;
        };
        const seen = [];
        const dup = t => !tidy(t) || seen.some(x => x === tidy(t) || same(x, t));
        const take = t => { seen.push(t); return t; };
        for (const i of tasks?.items ?? []) seen.push(i.label);

        const missing = projCache
          .filter(q => hasDepth(q) && !dup(q.title))
          .sort((a, c) => Number(!!c.guide) - Number(!!a.guide))
          .map(q => take(q.title));
        const rest = later.items.filter(l => !dup(l)).map(take);
        // 四个封顶。再多就不是「先收着的」，是又一张清单。
        for (const s of [...missing, ...rest].slice(0, 4)) {
          const proj = projFor(s);
          const can = hasDepth(proj);
          const p = el('chip' + (can ? ' can' : ''), 'span');
          p.textContent = can ? `${s} ›` : s;
          if (can) p.onclick = () => openDetail(proj);
          ch.appendChild(p);
        }
        b.appendChild(ch);
      }
      c.appendChild(b);
      box.appendChild(c);
    }
    prev = m.who;
  }
}

function drawTodo(box) {
  const p = el('pane');
  const tasks = [...(day.messages ?? [])].reverse()
    .flatMap(m => m.cards ?? []).find(c => c.type === 'tasks');
  const later = [...(day.messages ?? [])].reverse()
    .flatMap(m => m.cards ?? []).find(c => c.type === 'later');

  const head = s => { const h = el('ph'); h.textContent = s; p.appendChild(h); };
  head(X.today);
  const f = el('flat');
  if (tasks?.items.length) for (const i of tasks.items) f.appendChild(item(i));
  else { const e = el('empty'); e.textContent = X.none; f.appendChild(e); }
  p.appendChild(f);

  if (later?.items.length) {
    head(X.quiet);
    const ch = el('chips');
    for (const s of later.items) { const c = el('chip','span'); c.textContent = s; ch.appendChild(c); }
    p.appendChild(ch);
  }
  // 记忆按维度分组。时间是这里最要紧的一列——
  // 她得看得出哪条是旧的，才谈得上纠正。
  for (const g of day.memory?.groups ?? []) {
    head(g.key);
    const f = el('flat');
    for (const i of g.items) {
      const row = el('fact' + (i.stale ? ' stale' : ''));
      const t = el('ft'); t.textContent = i.text;
      const a = el('fa');
      a.textContent = i.stale ? X.stale
        : i.days === 0 ? X.today : i.days === 1 ? X.yday : X.daysAgo(i.days);
      row.append(t, a);
      f.appendChild(row);
    }
    p.appendChild(f);
  }
  box.appendChild(p);
}

function bub(text, who) {
  const b = el('bub');
  b.textContent = text;
  return b;
}
function item(i) {
  const e = el('item' + (i.forHer ? ' her' : '') + (i.done ? ' done' : ''));
  const tk = el('tick');
  tk.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg>';
  const col = el(''); col.style.minWidth = '0';
  const l = el('lab'); l.textContent = i.label; col.appendChild(l);
  if (i.note) { const s = el('sub'); s.textContent = i.note; col.appendChild(s); }
  e.append(tk, col);
  e.onclick = async () => {
    e.classList.toggle('done');
    try { day = await (await fetch('/toggle', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: i.id})})).json(); }
    catch {}
  };
  return e;
}

/** 临时气泡（开场白、状态），还没进对话流的那种。 */
function bubble(who, text, pending) {
  const t = el(`turn ${who} lead`);
  if (who === 'today') { const a = el('mini','img'); a.src = '/today-tiger.png'; t.appendChild(a); }
  const b = bub(text, who);
  if (pending) b.classList.add('pending');
  t.appendChild(b);
  $('scroll').appendChild(t);
  $('scroll').scrollTop = $('scroll').scrollHeight;
  return b;
}

/* ── 录音 ──────────────────────────────────── */
let rec = null, chunks = [], meter = null;
const MAX_MS = 60_000;
let maxTimer = null;

$('mic').onclick = async () => {
  /* getUserMedia 只在安全上下文下可用。从 http://192.168.x.x 打开时
     浏览器连权限框都不弹，直接拒绝——所以要在调用之前就说清楚，
     不然用户看到的是一句含糊的「设备不支持」，其实只是地址不对。 */
  if (!window.isSecureContext) { showErr(X.insecure); $('t').focus(); return; }
  if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
    showErr(X.noMic); $('t').focus(); return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4']
      .find(m => window.MediaRecorder?.isTypeSupported?.(m));
    rec = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined);
    chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      clearTimeout(maxTimer); maxTimer = null;
      meter?.ctx.close().catch(()=>{}); meter = null; $('lv').style.width = '0%';
      const blob = new Blob(chunks, {type: rec.mimeType || 'audio/webm'});
      $('recbar').hidden = true; $('bar').hidden = false;
      // 太短多半是误触，不值得发一趟请求
      if (blob.size < 1200) { showErr(X.tooShort); rec = null; return; }
      sendAudio(blob);
    };
    rec.start(); level(stream);
    maxTimer = setTimeout(() => {
      if (rec?.state === 'recording') { showErr(X.maxLen); rec.stop(); }
    }, MAX_MS);
    $('bar').hidden = true; $('recbar').hidden = false; $('err').hidden = true;
  } catch (e) {
    // 分清是被拒、没设备、还是别的——含糊的错让人不知道该做什么
    const n = e?.name;
    showErr(n === 'NotAllowedError' || n === 'SecurityError' ? X.denied
          : n === 'NotFoundError' ? X.noDevice
          : (e?.message || X.noMic));
    $('t').focus();
  }
};
$('stop').onclick = () => rec?.state === 'recording' && rec.stop();
$('drop').onclick = () => {
  clearTimeout(maxTimer); maxTimer = null;
  if (rec?.state === 'recording') { chunks = []; rec.onstop = null; rec.stop(); }
  meter?.ctx.close().catch(()=>{}); meter = null; rec = null;
  $('recbar').hidden = true; $('bar').hidden = false;
};
function level(stream) {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const an = ctx.createAnalyser(); an.fftSize = 256;
    ctx.createMediaStreamSource(stream).connect(an);
    const buf = new Uint8Array(an.frequencyBinCount);
    meter = {ctx};
    (function tick(){ if (!meter) return;
      an.getByteTimeDomainData(buf);
      let pk = 0; for (const v of buf) pk = Math.max(pk, Math.abs(v-128));
      $('lv').style.width = Math.min(100,(pk/58)*100) + '%';
      requestAnimationFrame(tick);
    })();
  } catch {}
}
async function sendAudio(blob) {
  const note = bubble('today', X.taking, true); thinking(true);
  try {
    const r = await fetch('/transcribe', {method:'POST',
      headers:{'Content-Type': blob.type||'audio/webm'}, body: blob});
    if (!r.ok) throw new Error(await r.text());
    const {text} = await r.json();
    if (!text) throw new Error('没听清');
    note.remove();
    await submit(text);
  } catch (e) { note.remove(); showErr(e.message||e); }
  finally { thinking(false); rec = null; }
}

async function submit(text) {
  const r = await fetch('/braindump', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({braindump:text, lang:LANG, mode: mode || undefined})});
  // 模式是一次性的：说完就回到默认，不让她记着自己现在在哪个模式里
  mode = ''; $('t').placeholder = X.ph;
  if (!r.ok) throw new Error(await r.text());
  day = await r.json();
  // 这一轮可能建了新的事、或者挂上了查回来的那张表——重新拉一遍，
  // 不然卡片上那几个 chip 点下去是空的。
  await syncProjects();
  draw();
}

/* 键盘一弹就当她开口了：收起 launch，别让它被切顶。
   挂在这儿不挂上面那段 viewport 脚本里——那段在 body 之前跑，
   输入框还不存在，`t?.addEventListener` 会静默什么都不做。 */
$('t').addEventListener('focus', () => { typing = true; settle(); });
$('t').addEventListener('blur',  () => { typing = false; settle(); });

$('t').addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const text = $('t').value.trim();
  if (!text) return;
  $('t').value = ''; $('t').blur();
  bubble('her', text);
  const note = bubble('today', X.taking, true);
  thinking(true); $('err').hidden = true;
  try { await submit(text); }
  catch (err) { note.remove(); showErr(err.message||err); }
  finally { thinking(false); }
});
</script>
